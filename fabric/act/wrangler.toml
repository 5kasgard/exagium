name = "forge-act"
main = "worker.js"
compatibility_date = "2026-11-01"
# Same rules as the read-only connector: workers.dev stays off (the subdomain carries the owner's name); the only
# address is the custom domain. Secrets (ACT_TOKEN, GH_TOKEN) are put by .github/workflows/act-deploy.yml.
workers_dev = false
preview_urls = false
routes = [{ pattern = "act.exagium.xyz", custom_domain = true }]

# The Forge's clock (2026-11-26). GitHub's own cron is unreliable here: in the 6-7 h after they were added,
# schedules.yml (hourly) ran 0 times, sandbox-eval.yml (3-hourly) 0 times, dash-snapshot.yml (hourly) 2 times
# (Actions run lists, 2026-11-26T03:30Z; AGENTS.md records the same in 2026-11-19). Cloudflare cron triggers start
# the workflows instead (Workers Paid). Each cron string maps to workflows in CRON_JOBS below.
# The Forge's own agent loop (fabric/agent): Discord /ask and "Reply to agent" reach it only through this binding.
[[services]]
binding = "AGENT"
service = "forge-agent"

[triggers]
crons = ["5 * * * *", "41 * * * *", "17 */3 * * *", "13 19 * * *"]

[vars]
# Agents may start these on main (2026-11-27: the Forge Lead could not redeploy box or check the sandbox test).
# Deploys only ship what is already merged; INPUT_RULES limits inputs where a value could spoil a measurement.
ALLOW_WORKFLOWS = "workbench-logs.yml,workbench-manage.yml,dash-snapshot.yml,box-deploy.yml,cfbox-deploy.yml,keys-probe.yml,box-sizes.yml,sandbox-eval.yml"
INPUT_RULES = '{"sandbox-eval.yml": {"mode": ["check"]}}'
CRON_JOBS = '{"5 * * * *": ["schedules.yml"], "41 * * * *": ["dash-snapshot.yml"], "17 */3 * * *": ["sandbox-eval.yml"], "13 19 * * *": ["models-rank.yml"]}'

[observability]
enabled = true   # request logs (no bodies) to debug Discord commands
