name = "forge-chat"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "chat.exagium.xyz", custom_domain = true }]
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

[vars]
ACCESS_TEAM = "skasgard"
ALLOW_PAID = "false"
# ACCESS_AUD and OWNER_EMAIL are set as secrets by chat-deploy.yml (the audience tag of the Access app; the owner's login)
