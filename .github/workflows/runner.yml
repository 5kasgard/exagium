# The general runner (runner/CONTRACT.md, queue P2): build each task, reproduce its candidates' training in the jail,
# and score them on the dev split. Manual only. No secrets; read-only token. Results are artifacts.
name: runner
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  task:
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: optdigits
            cands: majority label-linear label-mlp16 label-gbdt label-knn label-wisard
          - task: text
            cands: majority label-linear label-mlp16 label-gbdt label-knn label-wisard
          - task: adult
            cands: majority label-linear label-mlp16 label-gbdt label-knn label-wisard
          - task: sat
            cands: sat-zeros sat-walksat
    runs-on: ubuntu-24.04
    timeout-minutes: 240   # P3 step 1: label-gbdt trains about 21 min on text, three times (reproduce twice, evaluate once)
    env:
      TASK: ${{ matrix.task }}
      CANDS: ${{ matrix.cands }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq valgrind bubblewrap
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.5.3
          mkdir -p out
      - name: unit tests and the jail probe (Q10)
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest runner/test_runner.py
          "$RUNNER_TEMP/venv/bin/python" -c "import sys; sys.path.insert(0, 'runner'); import jail, json; print(json.dumps(jail.check()))" | tee "out/jail-$TASK.json"
      - name: build the task
        id: build
        run: '"$RUNNER_TEMP/venv/bin/python" -I tasks/build.py "$RUNNER_TEMP/built" --cache "$RUNNER_TEMP/dl" --only "$TASK"'
      - name: reproduce training (twice, in the jail)
        run: |
          set +e; "$RUNNER_TEMP/venv/bin/python" runner/run.py reproduce --data "$RUNNER_TEMP/built" --task "$TASK" \
            --cand $CANDS --out "out/reproduce-$TASK.json" 2>&1 | tee "out/reproduce-$TASK.txt"; rc=${PIPESTATUS[0]}; set -e
          echo "exit $rc"; exit $rc
      - name: score on dev
        if: ${{ !cancelled() }}
        run: |
          set +e; "$RUNNER_TEMP/venv/bin/python" runner/run.py evaluate --data "$RUNNER_TEMP/built" --task "$TASK" \
            --cand $CANDS --split dev --rounds 5 --records out/records --out "out/dev-$TASK.json" 2>&1 | tee "out/dev-$TASK.txt"
          rc=${PIPESTATUS[0]}; set -e; echo "exit $rc"; exit $rc
      - name: Q55, weights per OpenBLAS core type (text only)
        if: ${{ !cancelled() && matrix.task == 'text' && steps.build.outcome == 'success' }}
        run: '"$RUNNER_TEMP/venv/bin/python" runner/q55.py "$RUNNER_TEMP/built" text out/q55-text.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: runner-${{ matrix.task }}
          path: out/
