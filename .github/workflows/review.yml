# Outside review: send a committed prompt file to free engines of other model families and save the
# replies, as received, on router-runs under reviews/<run id>/. Manual only.
name: review
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "path of the prompt file in the repo"
        required: true
      engines:
        description: "space-separated ENGINE:MODEL list, or auto (two qualified reviewers from the least-used pools, router/pick.py)"
        default: "auto"
permissions:
  contents: write   # pushes the replies, as received, to the router-runs branch
defaults:
  run:
    shell: bash
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes to router-runs and uploads no artifact
      - name: ask
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
          ENGINES: ${{ github.event.inputs.engines }}
          # queue Q22: one line per call (time, engine, model, status, usage incl. Cloudflare neurons; no text). No
          # ROUTER_PAID_POOLS here, so a paid pool (gemini, cerebras, xai) is refused before any request (queue P4).
          ROUTER_USAGE_LOG: ${{ runner.temp }}/usage.jsonl
        run: |
          # allowlist (audit Q08): only a regular, tracked file under router/review/; this step holds the keys in its
          # environment, so a path like /proc/self/environ must never be copied to the public branch
          case "$PROMPT" in router/review/*) ;; *) echo "prompt must be under router/review/"; exit 1 ;; esac
          case "$PROMPT" in *..*) echo "prompt path must not contain .."; exit 1 ;; esac
          [ -f "$PROMPT" ] && [ ! -L "$PROMPT" ] && git ls-files --error-unmatch -- "$PROMPT" > /dev/null || { echo "prompt must be a tracked regular file"; exit 1; }
          # spread the load (owner 2026-11-20): read today's shared ledger, pick or check engines by each pool's headroom
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/led" FETCH_HEAD || mkdir -p "$RUNNER_TEMP/led/ledger"
          day="$RUNNER_TEMP/led/ledger/$(date -u +%F).json"
          if [ "$ENGINES" = auto ]; then ENGINES=$(python3 -I router/pick.py "$day" 2); else
            want="$ENGINES"; ENGINES=$(python3 -I router/pick.py "$day" check $want); [ "$ENGINES" = "$want" ] || echo "dropped for lack of headroom: $want -> $ENGINES"; fi
          echo "engines: $ENGINES"; [ -n "$ENGINES" ] || { echo "no pool has headroom today"; exit 1; }
          rc=0; python3 -I router/review.py "$PROMPT" "$RUNNER_TEMP/rev" $ENGINES || rc=$?
          cp "$PROMPT" "$RUNNER_TEMP/rev/prompt.txt"; echo "$GITHUB_SHA $PROMPT" > "$RUNNER_TEMP/rev/source.txt"
          [ -f "$RUNNER_TEMP/usage.jsonl" ] && cp "$RUNNER_TEMP/usage.jsonl" "$RUNNER_TEMP/rev/usage.jsonl"
          echo "exit $rc"
      - name: count these calls in the shared daily ledger (reviews used to be invisible to the worker's caps)
        if: ${{ always() }}
        run: |
          [ -s "$RUNNER_TEMP/usage.jsonl" ] || exit 0
          git config --global user.name "github-actions[bot]"; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d "$RUNNER_TEMP/led/.git" ] || [ -f "$RUNNER_TEMP/led/.git" ] || { echo "no ledger worktree"; exit 0; }
          python3 -I worker/ledger.py record "$RUNNER_TEMP/led" "review-$GITHUB_RUN_ID" "$RUNNER_TEMP/usage.jsonl" || echo "ledger record failed (calls stay in reviews/$GITHUB_RUN_ID/usage.jsonl)"
      - name: save the replies on router-runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # several reviews can run at once: rebuild the commit on the newest router-runs and retry the push
          for i in 1 2 3 4 5 6; do
            git fetch -q origin router-runs && git checkout -q -B router-runs FETCH_HEAD
            mkdir -p reviews && rm -rf "reviews/$GITHUB_RUN_ID" && cp -r "$RUNNER_TEMP/rev" "reviews/$GITHUB_RUN_ID"
            git add reviews && git commit -qm "outside review $GITHUB_RUN_ID"
            git push -q origin router-runs && { echo "pushed on try $i"; exit 0; }
            sleep $((i * 7))
          done
          exit 1
