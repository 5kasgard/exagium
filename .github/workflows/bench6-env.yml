# Queue P28 pilot, environment check (router/bench6/pilot/PLAN.md). No model call, no secret: pulls each candidate's
# SWE-rebench image and runs its own tests without and with the gold patch (known-answer negative and positive).
# mode gold / goldtest / empty / cheat (PLAN.md step 2): the attempt grader's known-answer runs (no model call); use ids=usable.
# mode agent-gold / agent-mock / agent-model (step 3, router/bench6/pilot/agent_attempt.py): one attempt inside the task's image by
# bench-4's base harness, graded by the sealed grader. agent-gold (gold patch as the agent) and agent-mock (local mock model)
# cost nothing and run first; agent-model uses the OpenRouter key through bench-4's meter, free models only.
name: bench6-env
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "comma-separated instance ids, all (the 12 frozen candidates) or usable (step 1's 8)"
        required: true
      mode:
        description: "env (step 1 check), or a step 2 known-answer mode: gold, goldtest, empty, cheat"
        required: false
        default: env
      cap:
        description: "agent modes: call cap (bench-4's base: 80)"
        required: false
        default: "80"
      wall:
        description: "agent modes: wall seconds (bench-4's base: 2100)"
        required: false
        default: "2100"
      model:
        description: "agent-model only: OpenRouter model (free only); bench-4's base default"
        required: false
        default: "nvidia/nemotron-3-ultra-550b-a55b:free"
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: m
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          import sys; sys.path.insert(0, "router/bench6/pilot"); import envcheck
          known = [c["instance_id"] for c in json.load(open("router/bench6/pilot/candidates.json"))["candidates"]]
          want = known if os.environ["IDS"] == "all" else envcheck.USABLE if os.environ["IDS"] == "usable" else [x.strip() for x in os.environ["IDS"].split(",") if x.strip()]
          bad = [x for x in want if x not in known]
          if bad or not want:
              raise SystemExit(f"not frozen candidates: {bad}")
          print("ids=" + json.dumps(want))
          PY
  check:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ startsWith(github.event.inputs.mode, 'agent-') && 110 || 30 }}   # PLAN.md; an attempt: bench-4's 2100 s wall + grading
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ startsWith(github.event.inputs.mode, 'agent-') && 2 || 6 }}   # OpenRouter free: 20 requests/min per account
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: free disk for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; df -h / | tail -1
      - name: build bench-4's harness image and copy out its base harness (OpenHands SDK)
        if: github.event.inputs.mode == 'agent-mock' || github.event.inputs.mode == 'agent-model'
        run: |
          docker build -q -t bench4:run router/bench4 > "$RUNNER_TEMP/build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/harness" && python3 -I router/bench6/pilot/agent_attempt.py extract bench4:run "$RUNNER_TEMP/harness"
      - name: hand the key to a file only the meter reads (it deletes the file once read)
        if: github.event.inputs.mode == 'agent-model'
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          if [[ "$MODEL" != *:free ]]; then echo "paid model refused: $MODEL"; exit 1; fi
          # bench-4's allowance guard (bench4.yml): under 180 free requests left, the attempt is not run (a refused attempt is not a result)
          left=$(curl -fsS -m 30 https://openrouter.ai/api/v1/key -H "Authorization: Bearer $KEY" \
                 | python3 -c "import json,sys;d=json.load(sys.stdin)['data'].get('free_model_daily_requests') or {};print(d.get('remaining',-1))" || echo -1)
          echo "free requests left: $left"
          if [ "$left" -ge 0 ] && [ "$left" -lt 180 ]; then echo "skipped: under 180 left"; exit 1; fi
          umask 077; printf '%s' "$KEY" > "$RUNNER_TEMP/meter.key"
          echo "exit 0"
      - name: check
        env:
          ID: ${{ matrix.id }}
          MODE: ${{ github.event.inputs.mode }}
          AMODEL: ${{ github.event.inputs.model }}
          ACAP: ${{ github.event.inputs.cap }}
          AWALL: ${{ github.event.inputs.wall }}
        run: |
          case "$MODE" in
            env|'') python3 -I router/bench6/pilot/envcheck.py run router/bench6/pilot/candidates.json "$ID" "$RUNNER_TEMP/out" ;;
            gold|goldtest|empty|cheat) python3 -I router/bench6/pilot/envcheck.py attempt router/bench6/pilot/candidates.json "$ID" "$MODE" "$RUNNER_TEMP/out" ;;
            agent-gold|agent-mock|agent-model)
              GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'); mkdir -p "$RUNNER_TEMP/harness" "$RUNNER_TEMP/out"
              BENCH4_KEY_FILE="$RUNNER_TEMP/meter.key" python3 -I router/bench6/pilot/agent_attempt.py run router/bench6/pilot/candidates.json \
                router/bench6/pilot/statements.json "$ID" "${MODE#agent-}" "$RUNNER_TEMP/out" "$RUNNER_TEMP/harness" "$GW" 8088 \
                router/bench4/seal.sh "$AMODEL" "$ACAP" "$AWALL" 1000   # defaults: bench-4's base harness, 80 calls, 2100 s
              rm -f "$RUNNER_TEMP/meter.key"; find "$RUNNER_TEMP/out" -type l -print -delete | head -20 ;;
            *) echo "mode must be env, gold, goldtest, empty, cheat or agent-gold, agent-mock, agent-model"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: env-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/out/result-*.json
            ${{ runner.temp }}/out/log-*.txt
            ${{ runner.temp }}/out/attempt-*.json
            ${{ runner.temp }}/out/attempt-log-*.txt
            ${{ runner.temp }}/out/agent-*
            ${{ runner.temp }}/out/meter-*.jsonl
            ${{ runner.temp }}/out/mock-*.jsonl
