# The ledger's only writer. A push that adds proposals to ledger/inbox/ makes this job:
#   1. run exactly the commit that triggered it (the commit its certificate names), or step aside if the
#      branch has moved on (the newer run will take the proposals);
#   2. refuse to go on unless every existing entry is already covered by this workflow's attestations
#      (so an entry written by hand is never vouched for later);
#   3. ingest the proposals; stamp the new head with OpenTimestamps; refuse to attest if the branch moved;
#   4. attest the exact range of entries it added (Sigstore, public Rekor); check every anchor; commit.
#   If the run fails or is cancelled after attesting, the bundle and entries go to the ci-runs branch, so the
#   orphaned attestation can be explained with its real statement and entries.
# The daily run also ingests any proposals a stepped-aside run left behind. Actions are pinned by commit;
# record.py runs with python3 -I so nothing next to it can shadow the standard library.
# A daily job completes pending OpenTimestamps proofs.
# Verifiers pin this identity: https://github.com/5kasgard/exagium/.github/workflows/record.yml@refs/heads/main
name: record
on:
  push:
    branches: [main]
    paths: ["ledger/inbox/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
env:
  LEDGER_REF: main
  WRITER: .github/workflows/record.yml
concurrency:
  group: record-writer   # one writer at a time, across every ref
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command in a pipe fails the step
jobs:
  append:   # also on the daily schedule and by hand, so proposals stranded by a stepped-aside run are picked up
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0   # github.sha: the commit the certificate will name
      - name: step aside if the branch has moved on
        id: current
        run: |
          git fetch -q origin "$LEDGER_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "superseded by $(git rev-parse FETCH_HEAD)"; echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: tools
        if: steps.current.outputs.go == 'yes'
        run: |
          # an isolated virtualenv: the runner's system pyOpenSSL breaks under a newer cryptography
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q sigstore==4.5.1 opentimestamps-client==0.8.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: the existing chain must be fully attested by this writer before anything is added
        if: steps.current.outputs.go == 'yes'
        run: |
          # exit 2 (an explorer unreachable) still means every entry is covered: coverage comes from Sigstore, checked offline
          rc=0; python3 -I record/record.py check-anchors --ref "refs/heads/$LEDGER_REF" --workflow "$WRITER" || rc=$?
          [ $rc -eq 0 ] || [ $rc -eq 2 ]
      - name: ingest inbox into the chain
        if: steps.current.outputs.go == 'yes'
        id: ingest
        run: |
          read before _ < <(python3 -I record/record.py head)
          python3 -I record/record.py ingest | tee "$RUNNER_TEMP/written.txt"
          read seq sha < <(python3 -I record/record.py head)
          echo "from=$((before + 1))" >> "$GITHUB_OUTPUT"; echo "seq=$seq" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "file=ledger/entries/$(printf %06d $seq).json" >> "$GITHUB_OUTPUT"
          echo "n=$(wc -l < "$RUNNER_TEMP/written.txt")" >> "$GITHUB_OUTPUT"
          echo "predicate=$(python3 -I record/record.py range $((before + 1)) $seq 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: stamp the head (OpenTimestamps); refuse to attest if the branch moved
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        run: |
          s=$(printf %06d ${{ steps.ingest.outputs.seq }})
          mkdir -p ledger/anchors
          cp ledger/entries/$s.json "$RUNNER_TEMP/$s.json" && ots stamp "$RUNNER_TEMP/$s.json"
          mv "$RUNNER_TEMP/$s.json.ots" ledger/anchors/$s.ots
          python3 -I record/record.py verify
          git fetch -q origin "$LEDGER_REF"
          [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ] || { echo "the branch moved since checkout; not attesting"; exit 1; }
      - name: attest the range of entries added (Sigstore, public Rekor)
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        id: att
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc  # v2.4.0
        with:
          subject-path: ${{ steps.ingest.outputs.file }}
          predicate-type: https://github.com/5kasgard/exagium/blob/main/record/README.md
          predicate: ${{ steps.ingest.outputs.predicate }}
      - name: check every anchor and commit
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        run: |
          s=$(printf %06d ${{ steps.ingest.outputs.seq }})
          cp "${{ steps.att.outputs.bundle-path }}" ledger/anchors/$s.sigstore.json
          # exit 2 (an explorer unreachable) mustn't orphan the attestation just made; exit 1 or 3 stops here
          rc=0; python3 -I record/record.py check-anchors --ref "refs/heads/$LEDGER_REF" --workflow "$WRITER" || rc=$?
          [ $rc -eq 0 ] || [ $rc -eq 2 ]
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ledger
          git commit -q -m "ledger: entries ${{ steps.ingest.outputs.from }}-${{ steps.ingest.outputs.seq }}, head sha256 ${{ steps.ingest.outputs.sha }} (run ${{ github.run_id }})"
          git push -q origin "HEAD:$LEDGER_REF"
      - name: after a failure past attesting, keep the orphaned attestation's bundle and entries on ci-runs
        if: (failure() || cancelled()) && steps.att.outcome == 'success'
        run: |
          d="$RUNNER_TEMP/ci"; git init -q "$d"
          cp -r ledger "$RUNNER_TEMP/ledger-orphan"; cp "${{ steps.att.outputs.bundle-path }}" "$RUNNER_TEMP/ledger-orphan/bundle.sigstore.json"
          cd "$d" && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          mkdir -p orphans && cp -r "$RUNNER_TEMP/ledger-orphan" "orphans/${{ github.run_id }}" && git add orphans
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "orphaned writer attestation, run ${{ github.run_id }}"
          git push -q origin ci-runs
  upgrade:
    if: github.event_name != 'push'
    needs: append
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ env.LEDGER_REF }}
      - name: complete pending OpenTimestamps proofs
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q opentimestamps-client==0.8.0
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          shopt -s nullglob
          for f in ledger/anchors/*.ots; do ots upgrade "$f" || true; done
          rm -f ledger/anchors/*.bak
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ledger/anchors
          git diff --cached --quiet || { git commit -q -m "ledger: upgrade OpenTimestamps proofs (run ${{ github.run_id }})"; git push -q origin "HEAD:$LEDGER_REF"; }
