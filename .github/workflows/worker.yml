# Queue worker (queue P8, first version): free models work queue items without a chat. Job types (worker/queue_ops.py):
# doc fixes with exact targets (doc_job.py) and literature cards (research_job.py, queue P7).
# Three jobs, as P5 and P8 require: `claim` (writes the queue, no keys), `draft` (keys, read-only token, runs nothing a
# model writes), `land` (writes, no keys: checks, applies, merges or opens a PR, records usage, releases the claim).
# Pause switch: a file worker/PAUSE on main stops every run before it claims anything.
name: worker
on:
  schedule:
    - cron: "17 * * * *"   # hourly; an idle run costs nothing on this public repo
  workflow_dispatch:
permissions: {}
concurrency:
  group: worker-${{ github.run_id }}   # runs may overlap on purpose: the queue's git CAS is the lock (P8's race test)
defaults:
  run:
    shell: bash
env:
  WORKER: worker-${{ github.run_id }}
jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # lanes: start more worker runs when more items are ready (P20e)
    outputs:
      item: ${{ steps.out.outputs.item }}
      type: ${{ steps.out.outputs.type }}
      stopped: ${{ steps.out.outputs.stopped }}
      paid: ${{ steps.out.outputs.paid }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads only claim.json from RUNNER_TEMP, never .git
      - name: pause switch
        run: |
          if [ -f worker/PAUSE ]; then echo "paused by worker/PAUSE"; echo "PAUSED=1" >> "$GITHUB_ENV"; fi
      - name: tests
        if: env.PAUSED != '1'
        run: python3 -m unittest worker/test_worker.py
      - name: budget headroom before claiming (review N1)
        if: env.PAUSED != '1'
        run: |
          rc=0; git ls-remote --exit-code origin worker-runs >/dev/null || rc=$?
          # GLM F007: only "no such branch" (2) takes the no-ledger path; any other failure stops here, loudly
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "::error::ls-remote failed ($rc): no budget check possible"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r0" FETCH_HEAD
            # which job types today's budget can still pay for (same specs as the reserve step); claim only those
            # research projects 600 neurons for its one Cloudflare call: measured max 438, all 23 Cloudflare calls in ledger/calls.jsonl
            # on worker-runs, 2026-11-18 to 19 (the old 1,500 had no source and on 2026-11-19 held research back with 1,359 neurons unused)
            types=""
            python3 -I worker/ledger.py check "$RUNNER_TEMP/r0" groq:1,cloudflare:1:500,nvidia:1 && types="doc"
            # research reads on Cloudflare (gpt-oss-120b) or, when Cloudflare's rolling window is full, on NIM (Nemotron 3 Ultra):
            # the only free reader that failed no call in the reader bake (run 44720253829: 6 of 6 reads, 21 decision-kept claims;
            # the free OpenRouter readers were rate-limited upstream on 5-6 of 6 reads)
            if python3 -I worker/ledger.py check "$RUNNER_TEMP/r0" cloudflare:1:600,nvidia:1,openrouter:1; then types="${types:+$types,}research"; echo "RESEARCH_SPEC=cloudflare:1:600,nvidia:1,openrouter:1" >> "$GITHUB_ENV"
            elif python3 -I worker/ledger.py check "$RUNNER_TEMP/r0" nvidia:2,openrouter:1; then types="${types:+$types,}research"; echo "RESEARCH_SPEC=nvidia:2,openrouter:1" >> "$GITHUB_ENV"; fi
            python3 -I worker/ledger.py check "$RUNNER_TEMP/r0" nvidia:2,groq:1 && types="${types:+$types,}code"   # coder and its reviewer
            echo "TYPES=$types" >> "$GITHUB_ENV"; echo "job types with budget today: ${types:-none}"
            if [ -z "$types" ]; then echo "PAUSED=1" >> "$GITHUB_ENV"; echo "STOPPED=budget" >> "$GITHUB_ENV"; echo "no budget headroom today: nothing claimed"; fi
          fi
      - name: claim the top ready item
        id: claim
        if: env.PAUSED != '1'
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git worktree add -q --detach "$RUNNER_TEMP/q" HEAD
          rc=0; python3 -I worker/queue_ops.py claim "$RUNNER_TEMP/q" "$WORKER" "$RUNNER_TEMP/claim.json" "${TYPES:-}" || rc=$?; echo "claim exit $rc"
          cat "$RUNNER_TEMP/claim.json"
          id=$(python3 -c "import json;i=json.load(open('$RUNNER_TEMP/claim.json')).get('item');print(i['id'] if i else '')")
          typ=$(python3 -c "import json,sys;sys.path.insert(0,'worker');import queue_ops as Q;i=json.load(open('$RUNNER_TEMP/claim.json')).get('item');print(Q.job_type(i) if i else '')")
          echo "ITEM=$id" >> "$GITHUB_ENV"; echo "TYPE=$typ" >> "$GITHUB_ENV"
      - name: reserve budget (1 drafter or reader call, 1 checker call; neurons projected per job type)
        if: env.ITEM != ''
        run: |
          rc=0; git ls-remote --exit-code origin worker-runs >/dev/null || rc=$?
          # GLM F007: only "no such branch" (2) takes the no-ledger path; any other failure stops here, loudly
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "::error::ls-remote failed ($rc): no budget check possible"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            git worktree add -q --detach "$RUNNER_TEMP/r" origin/worker-runs 2>/dev/null || { git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD; }
          else
            git worktree add -q --orphan -b worker-runs "$RUNNER_TEMP/r" && git -C "$RUNNER_TEMP/r" commit -q --allow-empty -m "worker-runs: ledger and digests" \
              && git -C "$RUNNER_TEMP/r" push -q origin worker-runs
          fi
          if [ "$TYPE" = doc ]; then spec=groq:1,cloudflare:1:500,nvidia:1; elif [ "$TYPE" = code ]; then spec=nvidia:2,groq:1; else spec=${RESEARCH_SPEC:-cloudflare:1:600,nvidia:1,openrouter:1}; fi
          rc=0; python3 -I worker/ledger.py reserve "$RUNNER_TEMP/r" "$WORKER" "$spec" || rc=$?
          if [ "$rc" != 0 ]; then
            echo '{"result": "not started: budget cap or ledger push failed", "where": ""}' > "$RUNNER_TEMP/note.json"
            python3 -I worker/queue_ops.py release "$RUNNER_TEMP/q" "$WORKER" "$ITEM" budget "$RUNNER_TEMP/note.json" || echo "release exit $? (the lease will expire)"   # review of Q60, 7
            echo "ITEM=" >> "$GITHUB_ENV"; echo "STOPPED=budget" >> "$GITHUB_ENV"
          fi
          echo "reserve exit $rc"
          # paid fallbacks for the reader (router/slots.py), reserved separately so a spent dollar cap never blocks free work
          if [ "$rc" = 0 ] && { [ "$TYPE" = research ] || [ "$TYPE" = code ]; } && python3 -I worker/ledger.py reserve "$RUNNER_TEMP/r" "$WORKER" "openrouter_paid:3:8"; then
            echo "PAID=1" >> "$GITHUB_ENV"; fi
      - id: out
        name: outputs, written once (a second write of a job output doesn't replace the first; release test, R2)
        if: always()
        run: |
          echo "item=${ITEM:-}" >> "$GITHUB_OUTPUT"; echo "type=${ITEM:+$TYPE}" >> "$GITHUB_OUTPUT"; echo "stopped=${STOPPED:-}" >> "$GITHUB_OUTPUT"
          echo "paid=${PAID:-}" >> "$GITHUB_OUTPUT"
          echo "item=${ITEM:-none} stopped=${STOPPED:-no}"
      - name: lanes - more items ready, start more runs, up to LANES at once (P20e; owner 2026-11-20 "parallel within limits")
        # Each run still claims one item through the queue's compare-and-push (overlap tested in P8's race test) and still
        # reserves its own budget in the ledger, so lanes add speed, not spend. A run that finds nothing goes idle as before.
        # Data: the worker ran one item at a time while up to 6 research items were ready (R14-R19, 2026-11-19/20).
        if: env.ITEM != ''
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          LANES: 3
        run: |
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused"; exit 0; fi
          ready=$(python3 -I worker/queue_ops.py ready "$RUNNER_TEMP/q" | grep -c . || true)
          # live = runs doing work: a run whose only unfinished job is its idle wait (or a pending idle) is not a lane (2026-11-20 11:40Z:
          # two idle runs counted as live, so R20 and R21 sat ready while one lane worked)
          live=0
          for id in $(gh api "repos/$R/actions/workflows/worker.yml/runs?per_page=30" -q '.workflow_runs[] | select(.status!="completed") | .id'); do
            busy=$(gh api "repos/$R/actions/runs/$id/jobs" -q '[.jobs[] | select(.status!="completed" and .name!="idle")] | length')
            [ "${busy:-0}" -gt 0 ] && live=$((live + 1))
          done
          add=$(( ready < LANES - live ? ready : LANES - live )); [ "$add" -gt 0 ] || { echo "ready $ready, live runs $live: no new lane"; exit 0; }
          for k in $(seq 1 "$add"); do gh workflow run worker.yml -R "$R" --ref main; done
          echo "ready $ready, live runs $live: started $add more"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: env.ITEM != ''
        with:
          name: claim
          path: ${{ runner.temp }}/claim.json
  prepare:
    # read-only, no keys: builds the prompt bundle, or runs the literature search, which parses untrusted API text (review m5)
    needs: claim
    if: needs.claim.outputs.item != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TYPE: ${{ needs.claim.outputs.type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: claim
          path: claim
      - name: prompt bundle (doc) or literature search by API scripts (research)
        run: |
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py context claim/claim.json . job
          elif [ "$TYPE" = code ]; then python3 -I worker/code_job.py context claim/claim.json . job
          else python3 -I worker/research_job.py search claim/claim.json job; fi
          cp claim/claim.json job/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bundle
          path: job/
  draft:
    needs: [claim, prepare]
    if: needs.claim.outputs.item != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # two checker attempts of up to 10 min each, plus the reader
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bundle
          path: job
      - name: drafter and reviewer (free models; their text is parsed as JSON, never run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # P31: the research checker's decision model (prompt text only)
          TYPE: ${{ needs.claim.outputs.type }}
          PAID_FALLBACK: ${{ needs.claim.outputs.paid }}   # 1 when the claim reserved paid reader fallbacks (dollar-capped ledger pool)
        run: |
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py draft job
          elif [ "$TYPE" = code ]; then python3 -I worker/code_job.py draft job
          else python3 -I worker/research_job.py read job; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: draft
          path: job/
  test:
    # code items only: the model-written change runs HERE and nowhere else - no secrets, a read-only token, no push
    needs: [claim, draft]
    if: ${{ always() && needs.claim.outputs.type == 'code' && needs.draft.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: draft
          path: job
      - name: apply the edits and run the item's test, then the CI suite (no secrets in this job)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy 2>/dev/null || true
          "$RUNNER_TEMP/venv/bin/python" -I worker/code_job.py test . job || echo "test step exit $?"
          mkdir -p tested && cp job/test.json tested/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: test
          path: tested/
  land:
    needs: [claim, prepare, draft, test]
    if: ${{ always() && needs.claim.outputs.item != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.release.outputs.status }}   # read by chain
    env:
      ITEM: ${{ needs.claim.outputs.item }}
      TYPE: ${{ needs.claim.outputs.type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads only job/ and note.json, never .git
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: draft
          path: job
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: needs.claim.outputs.type == 'code'
        continue-on-error: true
        with:
          name: test
          path: job
      - name: check, apply, merge or open a PR
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -f job/draft.json ] && [ ! -f job/read.json ]; then
            python3 -I worker/note.py note.json "failed: no draft (prepare or draft job did not finish)" "" "$RUN_URL"
            echo "OUTCOME=failed" >> "$GITHUB_ENV"; exit 0
          fi
          rc=0
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py apply . job || rc=$?
          elif [ "$TYPE" = code ]; then python3 -I worker/code_job.py apply . job || rc=$?
          else python3 -I worker/research_job.py card . job || rc=$?; fi
          if [ "$rc" != 0 ] || [ ! -f job/result.json ]; then
            python3 -I worker/note.py note.json "failed: the check or apply step exited $rc" "" "$RUN_URL"
            echo "OUTCOME=failed" >> "$GITHUB_ENV"; exit 0
          fi
          res=$(python3 -c "import json;print(json.load(open('job/result.json')).get('result',''))")
          msg=$(python3 -I worker/note.py msg "$ITEM" "$TYPE" job/result.json)
          if [ "$TYPE" = code ]; then python3 -c "import json;print('\n'.join(json.load(open('job/bundle.json'))['files']))" | while read -r f; do [ -e "$f" ] && git add -- "$f"; done; true   # only the item's own files (a file it was allowed to create but did not is skipped)
          fi
          git add -A -- '*.md' ':!job/**'   # job/ holds run files, never content (Q59: job/empty-card.md went into PRs #5, #6); stage first: a research card is a new file, which plain git diff would not see
          if git diff --cached --quiet; then
            python3 -I worker/note.py note.json "no accepted edit" "$RUN_URL" "$RUN_URL" job/result.json
            echo "OUTCOME=$(python3 -I worker/transitions.py classify job/result.json 1 none)" >> "$GITHUB_ENV"; exit 0
          fi
          # the lease may have run out while the jobs queued: check it right before any change leaves the runner (review of Q60, 5)
          git worktree add -q --detach "$RUNNER_TEMP/h" HEAD
          if ! python3 -I worker/queue_ops.py held "$RUNNER_TEMP/h" "$WORKER" "$ITEM"; then
            echo "OUTCOME=retry" >> "$GITHUB_ENV"
            python3 -I worker/note.py note.json "lease lost before landing: nothing pushed" "" "$RUN_URL" job/result.json || true; exit 0
          fi
          if [ "$res" = merge ]; then
            git commit -qm "$msg" -m "$TYPE job: drafted by gpt-oss-120b (Cloudflare), checked by Nemotron 3 Ultra (NIM) and by worker/${TYPE}_job.py. Run: $RUN_URL"
            pushed=0
            for i in 1 2 3; do
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done
            if [ "$pushed" = 1 ]; then
              echo "OUTCOME=merged" >> "$GITHUB_ENV"   # recorded before the note: a note failure must not turn a merge into a failure (review of Q60, 6)
              python3 -I worker/note.py note.json merged "main $(git rev-parse --short HEAD)" "$RUN_URL" job/result.json || true; exit 0
            fi
            echo "push to main failed 3 times: falling back to a PR (review M2)"
            git reset -q --soft HEAD~1
          fi
          b="worker/$ITEM-$GITHUB_RUN_ID"; git switch -q -c "$b"; git commit -qm "$msg"
          # on today's main: a branch cut from the run's older main "reverts" any workflow change made since, and GitHub
          # refuses that push to the Actions token (K5, 2026-11-20 20:50Z: 'without workflows permission')
          git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; echo "::error::the change no longer applies to main"; \
            python3 -I worker/note.py note.json "failed: the change conflicts with today's main" "" "$RUN_URL" job/result.json || true; \
            echo "OUTCOME=failed" >> "$GITHUB_ENV"; exit 0; }
          git push -q origin "$b"
          body="Queue item $ITEM ($TYPE), drafted by the worker and not merged. Reasons are in the run note on the queue branch. Run: $RUN_URL"
          if url=$(gh pr create --base main --head "$b" --title "$msg" --body "$body" 2>pr.err); then
            echo "OUTCOME=pr" >> "$GITHUB_ENV"; python3 -I worker/note.py note.json pr "$url" "$RUN_URL" job/result.json || true
          else
            echo "OUTCOME=pr_not_created" >> "$GITHUB_ENV"; python3 -I worker/note.py note.json "pr not created; branch pushed (Actions may not be allowed to create PRs)" "branch $b" "$RUN_URL" job/result.json || true
          fi
          cat note.json
      - name: record usage and release the claim
        id: release
        if: always()
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          [ -f note.json ] || python3 -I worker/note.py note.json "failed before a note was written" "" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD
          python3 -I worker/ledger.py record "$RUNNER_TEMP/r" "$WORKER" job/calls.jsonl || echo "ledger record exit $?"
          git worktree add -q --detach "$RUNNER_TEMP/q" HEAD
          rc=0; python3 -I worker/queue_ops.py release "$RUNNER_TEMP/q" "$WORKER" "$ITEM" "${OUTCOME:-failed}" note.json > release.out || rc=$?
          cat release.out
          # the chain reads the status release actually wrote, not a prediction (review of Q60, 8); unknown -> open, which never chains
          st=$(sed -n 's/^released-status=//p' release.out | tail -1)
          echo "status=${st:-open}" >> "$GITHUB_OUTPUT"
          echo "release exit $rc"; exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: result
          path: |
            job/
            note.json
  wake:
    # Queue Q58: a run that stopped for budget hands over to keeper.yml, which starts the worker when the daily caps reset
    # (00:05 UTC), so the worker never depends on GitHub's scheduler (measured unreliable on this repo, 2026-11-19).
    needs: claim
    if: ${{ always() && needs.claim.result == 'success' && needs.claim.outputs.stopped == 'budget' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: worker-wake
      cancel-in-progress: false
    permissions:
      actions: write   # dispatch keeper.yml; list keeper runs
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: start a keeper (budget reset, or an idle re-poll), unless one is already waiting or the worker is paused
        env:
          STOPPED: ${{ needs.claim.outputs.stopped }}
        run: |
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused: no keeper"; exit 0; fi
          waiting=$(gh api "repos/$R/actions/workflows/keeper.yml/runs?per_page=20" -q '[.workflow_runs[] | select(.status!="completed" and (.display_title | contains("worker.yml")))] | length')
          if [ "$waiting" -gt 0 ]; then echo "a worker keeper is already waiting ($waiting)"; exit 0; fi
          at=$(date -u -d "tomorrow 00:05" +%s)
          gh workflow run keeper.yml -R "$R" --ref main -f at="$at" -f workflow=worker.yml
          echo "keeper started: worker resumes at $(date -u -d "@$at" +%FT%TZ)"

  idle:
    # Nothing ready while budget remained (owner 2026-11-20: workers always run; a stop with work possible is a fault): wait
    # 30 minutes on this runner, then start the worker again. Its own job, not the keeper: a keeper already waiting for the
    # budget reset would block an idle re-poll for hours (2026-11-19 20:34Z, E5 ready). An idle poll makes no model call.
    # Also after a run that released its item back to open (a failed or retried run): the chain only follows progress, and
    # nothing else restarted the worker, so it sat 4 h with R18 and R19 ready (2026-11-20 01:53-06:00Z). Waiting 30 minutes
    # first keeps a failing provider from being hammered; a repeat failure escalates the item through transitions.py.
    needs: [claim, land]
    # GLM F008: a failed claim (tests, checkout, a crash) also re-polls, else only the unreliable cron restarted the worker
    if: ${{ always() && (needs.claim.result == 'failure' || (needs.claim.result == 'success' && ((needs.claim.outputs.item == '' && needs.claim.outputs.stopped == '') || (needs.claim.outputs.item != '' && (needs.land.outputs.status == 'open' || needs.land.result == 'failure'))))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:   # one idle poll waiting at a time
      group: worker-idle
      cancel-in-progress: false
    permissions:
      actions: write   # dispatch the worker; list worker runs
      contents: write  # read worker/PAUSE; push facts/status.json to worker-runs (P30)
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes facts/status.json with the checkout token and uploads no artifact
        with:
          fetch-depth: 1
      - name: check due changing facts by script (P30; no model call), while idle
        id: facts
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/fr" FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/fr/facts"
          rc=0; python3 -I facts/check.py facts/register.json "$RUNNER_TEMP/fr/facts/status.json" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cd "$RUNNER_TEMP/fr" && git add facts/status.json && { git diff --cached --quiet || { git commit -qm "facts: check, run $GITHUB_RUN_ID (rc $rc)" && git push -q origin HEAD:worker-runs || echo "status push failed (next idle run retries)"; }; }
      - name: no item was ready - file research questions for open items (P27 kind 1; free models; runs no model text)
        id: gen
        if: needs.claim.result == 'success' && needs.claim.outputs.item == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # the generator's draft and gate calls (prompt text only)
        run: |
          echo "accepted=0" >> "$GITHUB_OUTPUT"
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/gl" FETCH_HEAD
          python3 -I worker/ledger.py reserve "$RUNNER_TEMP/gl" "gen-$GITHUB_RUN_ID" "openrouter:4" || { echo "no OpenRouter budget: not generating"; exit 0; }
          git fetch -q origin pilot/lgn-20261115 && git worktree add -q --detach "$RUNNER_TEMP/gq" FETCH_HEAD
          rc=0; python3 -I worker/generate.py "$RUNNER_TEMP/gq" "$RUNNER_TEMP/gen" | tee "$RUNNER_TEMP/gen.log" || rc=$?
          python3 -I worker/ledger.py record "$RUNNER_TEMP/gl" "gen-$GITHUB_RUN_ID" "$RUNNER_TEMP/gen/calls.jsonl" || echo "ledger record exit $?"
          n=$(python3 -c "import json;print(sum(o=='accept' for _,o in json.load(open('$RUNNER_TEMP/gen/generate.json')).get('moved',[])))" 2>/dev/null || echo 0)
          echo "accepted=$n" >> "$GITHUB_OUTPUT"; echo "generator exit $rc, accepted $n"
          cat "$RUNNER_TEMP/gen/generate.json" 2>/dev/null | head -c 6000   # drafts, gate probabilities and controls, for the record
      - name: no item was ready - split big open items into worker-sized code items (worker/split.py; Haiku drafts, decision model gates)
        id: split
        if: needs.claim.result == 'success' && needs.claim.outputs.item == ''
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}       # the splitter's draft (prompt text only; nothing is run here)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # the gate
        run: |
          echo "accepted=0" >> "$GITHUB_OUTPUT"
          [ -d "$RUNNER_TEMP/gl" ] || { git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/gl" FETCH_HEAD; }
          python3 -I worker/ledger.py reserve "$RUNNER_TEMP/gl" "split-$GITHUB_RUN_ID" "anthropic:2:6,openrouter:1" || { echo "no budget: not splitting"; exit 0; }
          [ -d "$RUNNER_TEMP/gq" ] || { git fetch -q origin pilot/lgn-20261115 && git worktree add -q --detach "$RUNNER_TEMP/gq" FETCH_HEAD; }
          rc=0; python3 -I worker/split.py "$RUNNER_TEMP/gq" . "$RUNNER_TEMP/split" | tee "$RUNNER_TEMP/split.log" || rc=$?
          python3 -I worker/ledger.py record "$RUNNER_TEMP/gl" "split-$GITHUB_RUN_ID" "$RUNNER_TEMP/split/calls.jsonl" || echo "ledger record exit $?"
          n=$(grep -c "'accept')" "$RUNNER_TEMP/split.log" 2>/dev/null || true); n=${n:-0}   # grep -c prints 0 AND exits 1, so an or-echo fallback wrote two lines and killed the idle job from 12:50Z: the worker stopped overnight
          echo "accepted=$n" >> "$GITHUB_OUTPUT"; echo "splitter exit $rc, accepted $n"
      - name: start experiments that open items name (worker/dispatch_experiments.py; no model; the run has no secrets)
        if: needs.claim.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d "$RUNNER_TEMP/gq" ] || { git fetch -q origin pilot/lgn-20261115 && git worktree add -q --detach "$RUNNER_TEMP/gq" FETCH_HEAD; }
          python3 -I worker/dispatch_experiments.py "$RUNNER_TEMP/gq" . 3 || echo "dispatch exit $?"
      - name: keep the schedules (GitHub dropped every tier, wiring and digest cron run overnight 2026-11-20/21)
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          for pair in tier:10800 wiring:21600 digest:86400; do
            wf=${pair%%:*}; period=${pair##*:}
            last=$(gh api "repos/$R/actions/workflows/$wf.yml/runs?per_page=1" -q '.workflow_runs[0].created_at' 2>/dev/null)
            t=$(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s 2>/dev/null || echo 0)
            if [ $((now - t)) -ge "$period" ]; then gh workflow run "$wf.yml" -R "$R" --ref main && echo "$wf: last run $last, started"; else echo "$wf: last run $last, not due"; fi
          done
      - name: wait 10 minutes, then start the worker unless paused or already started
        run: |
          if [ "${{ steps.gen.outputs.accepted }}" -gt 0 ] 2>/dev/null || [ "${{ steps.split.outputs.accepted }}" -gt 0 ] 2>/dev/null; then echo "new items accepted: starting the worker now"; else sleep 600; fi
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused"; exit 0; fi
          busy=$(gh api "repos/$R/actions/workflows/worker.yml/runs?per_page=10" -q '[.workflow_runs[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or (.status=="in_progress" and .id != ${{ github.run_id }}))] | length')
          if [ "$busy" -gt 0 ]; then echo "a worker run is already queued or running ($busy)"; exit 0; fi
          gh workflow run worker.yml -R "$R" --ref main && echo "idle re-poll: worker started"
      - name: a changed fact fails this run (after the worker restart, so work continues); the Claude shift sees it in its health check
        if: steps.facts.outputs.rc == '2'
        run: |
          echo "::error::a registered fact changed: see the facts step and worker-runs facts/status.json (queue P30)"; exit 1
      - name: if any step above failed, start the worker anyway (an idle crash stopped the loop overnight 2026-11-20/21)
        if: ${{ failure() }}
        run: |
          sleep 300
          gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1 && { echo paused; exit 0; }
          gh workflow run worker.yml -R "$R" --ref main && echo "worker started after an idle failure"

  chain:
    # Queue Q57: GitHub's free scheduler delayed or dropped the hourly cron (0 of ~8 fired on 2026-11-18/19), so a run that
    # found work starts the next run itself. A workflow_dispatch made with the job's own token does start a new run.
    # Guards: not when paused, when nothing was claimed or the item did not land (no work or no budget: claim leaves item empty); not when a
    # worker run is already waiting to start (at most one pending); at most CHAIN_CAP chained runs per UTC day. The cron stays as a backup.
    needs: [claim, land]
    # only after a run whose item did not go back to open: land exits 0 on a failed item and releases it as open, so a
    # failing item would otherwise be retried up to the cap (review 44392240031, 2; the check is on the status, not the job result)
    if: ${{ always() && needs.claim.outputs.item != '' && needs.land.result == 'success' && contains(fromJSON('["done", "review", "escalated"]'), needs.land.outputs.status) }}   # chain only after progress (Q60)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:   # serialise check-then-dispatch across runs, so two chains can't both see 0 waiting (review 44392240031, 2)
      group: worker-chain
      cancel-in-progress: false
    permissions:
      actions: write     # dispatch the next run and list today's runs
      contents: read     # read worker/PAUSE
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      CHAIN_CAP: 200   # a backstop for a bug only: the chain runs only after an item lands (no loop without progress) and the
                       # ledger's daily budget caps bind far earlier (2026-11-19: 24 stopped release test 2 at 26 of 30 items)
    steps:
      - name: a PR is waiting - start the tier now, not at its next 3-hourly slot (event-driven; tier.yml keeps one run pending)
        if: needs.land.outputs.status == 'review'
        run: |
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused"; exit 0; fi
          # batched: at most one start per 30 minutes, since every tier run spends 4 Haiku control calls before any PR ($0.30/day cap)
          last=$(gh api "repos/$R/actions/workflows/tier.yml/runs?per_page=1" -q '.workflow_runs[0].created_at' 2>/dev/null)
          if [ $(( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) )) -lt 1800 ]; then echo "tier ran at $last: the PR waits for the next batch"; exit 0; fi
          gh workflow run tier.yml -R "$R" --ref main && echo "tier started for the waiting PR" || echo "tier dispatch failed (its schedule still runs)"
      - name: start the next run if the guards allow
        run: |
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused: not chaining"; exit 0; fi
          waiting=$(gh api "repos/$R/actions/workflows/worker.yml/runs?per_page=50" \
            -q '[.workflow_runs[] | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$waiting" -gt 0 ]; then echo "a worker run is already waiting ($waiting): not chaining"; exit 0; fi
          today=$(date -u +%F)
          # --paginate: one page held at most 100, so the 200 cap could never fire (GLM F002)
          chained=$(gh api --paginate "repos/$R/actions/workflows/worker.yml/runs?event=workflow_dispatch&created=>=$today&per_page=100" \
            -q '[.workflow_runs[] | select(.triggering_actor.login=="github-actions[bot]")] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$chained" -ge "$CHAIN_CAP" ]; then echo "daily cap reached ($chained of $CHAIN_CAP): not chaining"; exit 0; fi
          gh workflow run worker.yml -R "$R" --ref main
          echo "chained run $((chained + 1)) of $CHAIN_CAP today (UTC $today)"
