# Queue worker (queue P8, first version): free models work queue items without a chat. Job types (worker/queue_ops.py):
# doc fixes with exact targets (doc_job.py) and literature cards (research_job.py, queue P7).
# Three jobs, as P5 and P8 require: `claim` (writes the queue, no keys), `draft` (keys, read-only token, runs nothing a
# model writes), `land` (writes, no keys: checks, applies, merges or opens a PR, records usage, releases the claim).
# Pause switch: a file worker/PAUSE on main stops every run before it claims anything.
name: worker
on:
  schedule:
    - cron: "17 * * * *"   # hourly; an idle run costs nothing on this public repo
  workflow_dispatch:
permissions: {}
concurrency:
  group: worker-${{ github.run_id }}   # runs may overlap on purpose: the queue's git CAS is the lock (P8's race test)
defaults:
  run:
    shell: bash
env:
  WORKER: worker-${{ github.run_id }}
jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      item: ${{ steps.out.outputs.item }}
      type: ${{ steps.out.outputs.type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads only claim.json from RUNNER_TEMP, never .git
      - name: pause switch
        run: |
          if [ -f worker/PAUSE ]; then echo "paused by worker/PAUSE"; echo "PAUSED=1" >> "$GITHUB_ENV"; fi
      - name: tests
        if: env.PAUSED != '1'
        run: python3 -m unittest worker/test_worker.py
      - name: budget headroom before claiming (review N1)
        if: env.PAUSED != '1'
        run: |
          if git ls-remote --exit-code origin worker-runs >/dev/null; then
            git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r0" FETCH_HEAD
            rc=0; python3 -I worker/ledger.py check "$RUNNER_TEMP/r0" cloudflare:1:400,nvidia:1 || rc=$?
            if [ "$rc" = 2 ]; then echo "PAUSED=1" >> "$GITHUB_ENV"; echo "no budget headroom today: nothing claimed"; fi
          fi
      - name: claim the top ready item
        id: claim
        if: env.PAUSED != '1'
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git worktree add -q --detach "$RUNNER_TEMP/q" HEAD
          rc=0; python3 -I worker/queue_ops.py claim "$RUNNER_TEMP/q" "$WORKER" "$RUNNER_TEMP/claim.json" || rc=$?; echo "claim exit $rc"
          cat "$RUNNER_TEMP/claim.json"
          id=$(python3 -c "import json;i=json.load(open('$RUNNER_TEMP/claim.json')).get('item');print(i['id'] if i else '')")
          typ=$(python3 -c "import json,sys;sys.path.insert(0,'worker');import queue_ops as Q;i=json.load(open('$RUNNER_TEMP/claim.json')).get('item');print(Q.job_type(i) if i else '')")
          echo "ITEM=$id" >> "$GITHUB_ENV"; echo "TYPE=$typ" >> "$GITHUB_ENV"
      - name: reserve budget (1 drafter or reader call, 1 checker call; neurons projected per job type)
        if: env.ITEM != ''
        run: |
          if git ls-remote --exit-code origin worker-runs >/dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/r" origin/worker-runs 2>/dev/null || { git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD; }
          else
            git worktree add -q --orphan -b worker-runs "$RUNNER_TEMP/r" && git -C "$RUNNER_TEMP/r" commit -q --allow-empty -m "worker-runs: ledger and digests" \
              && git -C "$RUNNER_TEMP/r" push -q origin worker-runs
          fi
          if [ "$TYPE" = doc ]; then spec=groq:1,cloudflare:1:400,nvidia:1; else spec=cloudflare:1:1500,nvidia:1; fi
          rc=0; python3 -I worker/ledger.py reserve "$RUNNER_TEMP/r" "$WORKER" "$spec" || rc=$?
          if [ "$rc" != 0 ]; then
            echo '{"result": "not started: budget cap or ledger push failed", "where": ""}' > "$RUNNER_TEMP/note.json"
            python3 -I worker/queue_ops.py release "$RUNNER_TEMP/q" "$WORKER" "$ITEM" open "$RUNNER_TEMP/note.json"
            echo "ITEM=" >> "$GITHUB_ENV"
          fi
          echo "reserve exit $rc"
      - id: out
        name: outputs, written once (a second write of a job output doesn't replace the first; release test, R2)
        if: always() && env.PAUSED != '1'
        run: |
          echo "item=${ITEM:-}" >> "$GITHUB_OUTPUT"; echo "type=${ITEM:+$TYPE}" >> "$GITHUB_OUTPUT"; echo "item=${ITEM:-none}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: env.ITEM != ''
        with:
          name: claim
          path: ${{ runner.temp }}/claim.json
  prepare:
    # read-only, no keys: builds the prompt bundle, or runs the literature search, which parses untrusted API text (review m5)
    needs: claim
    if: needs.claim.outputs.item != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TYPE: ${{ needs.claim.outputs.type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: claim
          path: claim
      - name: prompt bundle (doc) or literature search by API scripts (research)
        run: |
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py context claim/claim.json . job
          else python3 -I worker/research_job.py search claim/claim.json job; fi
          cp claim/claim.json job/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bundle
          path: job/
  draft:
    needs: [claim, prepare]
    if: needs.claim.outputs.item != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # two checker attempts of up to 10 min each, plus the reader
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bundle
          path: job
      - name: drafter and reviewer (free models; their text is parsed as JSON, never run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TYPE: ${{ needs.claim.outputs.type }}
        run: |
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py draft job; else python3 -I worker/research_job.py read job; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: draft
          path: job/
  land:
    needs: [claim, prepare, draft]
    if: ${{ always() && needs.claim.outputs.item != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.release.outputs.status }}   # read by chain
    env:
      ITEM: ${{ needs.claim.outputs.item }}
      TYPE: ${{ needs.claim.outputs.type }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads only job/ and note.json, never .git
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: draft
          path: job
      - name: check, apply, merge or open a PR
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -f job/draft.json ] && [ ! -f job/read.json ]; then
            python3 -I worker/note.py note.json "failed: no draft (prepare or draft job did not finish)" "" "$RUN_URL"
            echo "STATUS=open" >> "$GITHUB_ENV"; exit 0
          fi
          rc=0
          if [ "$TYPE" = doc ]; then python3 -I worker/doc_job.py apply . job || rc=$?; else python3 -I worker/research_job.py card . job || rc=$?; fi
          if [ "$rc" != 0 ] || [ ! -f job/result.json ]; then
            python3 -I worker/note.py note.json "failed: the check or apply step exited $rc" "" "$RUN_URL"
            echo "STATUS=open" >> "$GITHUB_ENV"; exit 0
          fi
          res=$(python3 -c "import json;print(json.load(open('job/result.json')).get('result',''))")
          msg=$(python3 -I worker/note.py msg "$ITEM" "$TYPE" job/result.json)
          git add -A -- '*.md'   # stage first: a research card is a new file, which plain git diff would not see
          if git diff --cached --quiet; then
            python3 -I worker/note.py note.json "no accepted edit" "$RUN_URL" "$RUN_URL" job/result.json
            echo "STATUS=waiting on the owner" >> "$GITHUB_ENV"; exit 0
          fi
          if [ "$res" = merge ]; then
            git commit -qm "$msg" -m "$TYPE job: drafted by gpt-oss-120b (Cloudflare), checked by Nemotron 3 Ultra (NIM) and by worker/${TYPE}_job.py. Run: $RUN_URL"
            pushed=0
            for i in 1 2 3; do
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true; sleep 5
            done
            if [ "$pushed" = 1 ]; then
              python3 -I worker/note.py note.json merged "main $(git rev-parse --short HEAD)" "$RUN_URL" job/result.json
              echo "STATUS=done" >> "$GITHUB_ENV"; exit 0
            fi
            echo "push to main failed 3 times: falling back to a PR (review M2)"
            git reset -q --soft HEAD~1
          fi
          b="worker/$ITEM-$GITHUB_RUN_ID"; git switch -q -c "$b"; git commit -qm "$msg"; git push -q origin "$b"
          body="Queue item $ITEM ($TYPE), drafted by the worker and not merged. Reasons are in the run note on the queue branch. Run: $RUN_URL"
          if url=$(gh pr create --base main --head "$b" --title "$msg" --body "$body" 2>pr.err); then
            python3 -I worker/note.py note.json pr "$url" "$RUN_URL" job/result.json
          else
            python3 -I worker/note.py note.json "pr not created; branch pushed (Actions may not be allowed to create PRs)" "branch $b" "$RUN_URL" job/result.json
          fi
          echo "STATUS=waiting on the owner" >> "$GITHUB_ENV"
          cat note.json
      - name: record usage and release the claim
        id: release
        if: always()
        run: |
          echo "status=${STATUS:-open}" >> "$GITHUB_OUTPUT"
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          [ -f note.json ] || python3 -I worker/note.py note.json "failed before a note was written" "" "$GITHUB_RUN_ID"
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD
          if [ -f job/calls.jsonl ]; then python3 -I worker/ledger.py record "$RUNNER_TEMP/r" "$WORKER" job/calls.jsonl || echo "ledger record exit $?"; fi
          git worktree add -q --detach "$RUNNER_TEMP/q" HEAD
          rc=0; python3 -I worker/queue_ops.py release "$RUNNER_TEMP/q" "$WORKER" "$ITEM" "${STATUS:-open}" note.json || rc=$?
          echo "release exit $rc"; exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: result
          path: |
            job/
            note.json
  chain:
    # Queue Q57: GitHub's free scheduler delayed or dropped the hourly cron (0 of ~8 fired on 2026-11-18/19), so a run that
    # found work starts the next run itself. A workflow_dispatch made with the job's own token does start a new run.
    # Guards: not when paused, when nothing was claimed or the item did not land (no work or no budget: claim leaves item empty); not when a
    # worker run is already waiting to start (at most one pending); at most CHAIN_CAP chained runs per UTC day. The cron stays as a backup.
    needs: [claim, land]
    # only after a run whose item did not go back to open: land exits 0 on a failed item and releases it as open, so a
    # failing item would otherwise be retried up to the cap (review 44392240031, 2; the check is on the status, not the job result)
    if: ${{ always() && needs.claim.outputs.item != '' && needs.land.result == 'success' && needs.land.outputs.status != 'open' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:   # serialise check-then-dispatch across runs, so two chains can't both see 0 waiting (review 44392240031, 2)
      group: worker-chain
      cancel-in-progress: false
    permissions:
      actions: write     # dispatch the next run and list today's runs
      contents: read     # read worker/PAUSE
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      CHAIN_CAP: 24
    steps:
      - name: start the next run if the guards allow
        run: |
          if gh api "repos/$R/contents/worker/PAUSE?ref=main" >/dev/null 2>&1; then echo "paused: not chaining"; exit 0; fi
          waiting=$(gh api "repos/$R/actions/workflows/worker.yml/runs?per_page=50" \
            -q '[.workflow_runs[] | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$waiting" -gt 0 ]; then echo "a worker run is already waiting ($waiting): not chaining"; exit 0; fi
          today=$(date -u +%F)
          chained=$(gh api "repos/$R/actions/workflows/worker.yml/runs?event=workflow_dispatch&created=>=$today&per_page=100" \
            -q '[.workflow_runs[] | select(.triggering_actor.login=="github-actions[bot]")] | length')
          if [ "$chained" -ge "$CHAIN_CAP" ]; then echo "daily cap reached ($chained of $CHAIN_CAP): not chaining"; exit 0; fi
          gh workflow run worker.yml -R "$R" --ref main
          echo "chained run $((chained + 1)) of $CHAIN_CAP today (UTC $today)"
