# bench-2: OpenHands Agent Server (SDK v1.61.0, pinned) in a sealed Docker container, free models,
# exagium's past fixes. See router/bench2/PREREG.md. Manual only.
# The agent's container mounts only the pre-fix workspace. The full checkout is deleted before the agent starts;
# the grader, hidden test and pass-to-pass list are copied to a private directory first.
name: bench2
on:
  workflow_dispatch:
concurrency:
  group: bench
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  SDK_REF: v1.61.0
  IMAGE: ghcr.io/openhands/agent-server:1.61.0-python
  MAX_ITERATIONS: "80"
jobs:
  attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2   # OpenRouter free: 20 requests/min across the account
      matrix:
        task: [T1, T2, T3]
        arm:
          - {name: A, model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"}
          - {name: B, model: "openrouter/recursive/flint-v1.0:free"}
          - {name: D, model: "openrouter/cohere/north-mini-code:free"}
          - {name: Z, model: "none"}   # control: no agent, grade the untouched base
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: {fetch-depth: 0, path: src}
      - name: refuse paid models
        run: |
          m="${{ matrix.arm.model }}"
          if [[ "$m" != none && "$m" != *:free ]]; then echo "paid model refused: $m"; exit 1; fi
          echo "exit 0"
      - name: private grader copy, pre-fix workspace, then delete the full checkout
        run: |
          P="$RUNNER_TEMP/private"; mkdir -p "$P"
          read base fix hidden < <(python3 -c "import json;t=[x for x in json.load(open('src/router/bench/tasks.json')) if x['id']=='${{ matrix.task }}'][0];print(t['base'],t['fix'],t['hidden_test'])")
          echo "FIX=$fix" >> "$GITHUB_ENV"; echo "HIDDEN=$hidden" >> "$GITHUB_ENV"; echo "P=$P" >> "$GITHUB_ENV"
          cp src/router/bench/grade.py src/router/bench2/run_agent.py src/router/bench2/measure.py "src/router/bench/p2p-$fix.json" "src/router/bench/tasks/${{ matrix.task }}.md" "$P/"
          git -C src show "$fix:record/test_record.py" > "$P/fix_test.py"
          WS="$RUNNER_TEMP/ws"; mkdir -p "$WS"; echo "WS=$WS" >> "$GITHUB_ENV"
          git -C src archive "$base" | tar -x -C "$WS"
          rm -rf src   # nothing post-fix is left on the runner's disk outside $P
          cd "$WS" && git init -q && git add -A && git -c user.name=bench -c user.email=bench@example.invalid commit -qm base
          chmod -R a+rwX "$WS"   # the agent server runs as a non-root user inside its container
          echo "exit 0"
      - name: install the pinned SDK and pull the matching Agent Server image
        if: matrix.arm.name != 'Z'
        run: |
          pip install -q uv && uv venv -q -p 3.12 "$RUNNER_TEMP/venv"
          for p in openhands-sdk openhands-tools openhands-workspace; do
            uv pip install -q -p "$RUNNER_TEMP/venv" "$p @ git+https://github.com/OpenHands/software-agent-sdk@$SDK_REF#subdirectory=$p"
          done
          docker pull -q "$IMAGE"
          echo "exit 0"
      - name: agent attempt (sealed container)
        if: matrix.arm.name != 'Z'
        env:
          LLM_MODEL: ${{ matrix.arm.model }}
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: |
          rc=0; timeout 2100 "$RUNNER_TEMP/venv/bin/python" "$P/run_agent.py" "$P/${{ matrix.task }}.md" "$WS" "$RUNNER_TEMP/out" "$IMAGE" "$MAX_ITERATIONS" || rc=$?
          echo "AGENT_RC=$rc" >> "$GITHUB_ENV"; echo "exit $rc"
      - name: grade and measure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"; [ -f "$RUNNER_TEMP/out/run.json" ] || echo '{"error": "harness: no run.json (agent step rc='"${AGENT_RC:-none}"')"}' > "$RUNNER_TEMP/out/run.json"
          [ -f "$RUNNER_TEMP/out/events.jsonl" ] || : > "$RUNNER_TEMP/out/events.jsonl"
          sudo chown -R "$(id -u)" "$WS" 2>/dev/null || true
          git -C "$WS" add -A >/dev/null 2>&1; d=$(git -C "$WS" diff --cached --shortstat HEAD 2>/dev/null || true)
          g=$(python3 "$P/grade.py" "$WS" "$P/fix_test.py" "$HIDDEN" "$P/p2p-$FIX.json")
          python3 "$P/measure.py" "$RUNNER_TEMP/out" "$g" "$d" > "$RUNNER_TEMP/out/result.json"
          python3 -c "import json;r=json.load(open('$RUNNER_TEMP/out/result.json'));r.update(task='${{ matrix.task }}',arm='${{ matrix.arm.name }}',model='${{ matrix.arm.model }}',commit='$GITHUB_SHA');json.dump(r,open('$RUNNER_TEMP/out/result.json','w'));print({k:r[k] for k in ('task','arm','passed','end','llm_calls','actions','wall_s','clean','diff')})"
          git -C "$WS" diff --cached HEAD > "$RUNNER_TEMP/out/agent.diff" 2>/dev/null || true
          echo "exit 0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench2-${{ matrix.task }}-${{ matrix.arm.name }}
          path: ${{ runner.temp }}/out/
  record:
    needs: attempt
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/download-artifact@v4
        with: {path: art, pattern: bench2-*}
      - name: commit results to router-runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="bench/bench2-$GITHUB_RUN_ID"; mkdir -p "/tmp/$dest" && cp -r art/* "/tmp/$dest/"
          git fetch -q origin router-runs && git checkout -q -B router-runs FETCH_HEAD
          mkdir -p bench && cp -r "/tmp/$dest" bench/
          git add bench && git commit -qm "bench-2 run $GITHUB_RUN_ID" && git push -q origin router-runs
          echo "exit 0"
