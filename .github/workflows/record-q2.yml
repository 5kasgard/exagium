# The ledger's only writer. A push that adds proposals to ledger/inbox/ makes this job append them
# to the hash chain, anchor the new head (Sigstore attestation in public Rekor + OpenTimestamps),
# check everything, and commit. A daily job completes pending OpenTimestamps proofs.
# Verifiers pin this file's identity: https://github.com/5kasgard/exagium/.github/workflows/record.yml@refs/heads/main
name: record-q2 (test copy of record.yml for the monitor and gh-verify experiments)
on:
  push:
    branches: [q2-main, q2-shadow]
    paths: ["ledger/inbox/**"]
concurrency:
  group: record-q2-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  append:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          # an isolated virtualenv: the runner's system pyOpenSSL breaks under a newer cryptography
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q sigstore==4.5.1 opentimestamps-client==0.8.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: ingest inbox into the chain
        id: ingest
        run: |
          python3 record/record.py verify > /dev/null
          python3 record/record.py ingest | tee written.txt
          read seq sha < <(python3 record/record.py head)
          echo "seq=$seq" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "file=ledger/entries/$(printf %06d $seq).json" >> "$GITHUB_OUTPUT"
          echo "n=$(wc -l < written.txt)" >> "$GITHUB_OUTPUT"
      - name: attest the head (Sigstore, public Rekor)
        if: steps.ingest.outputs.n != '0'
        id: att
        uses: actions/attest@v2
        with:
          subject-path: ${{ steps.ingest.outputs.file }}
          predicate-type: https://github.com/5kasgard/exagium/blob/main/record/README.md#head-v1
          predicate: '{"ledger_head_seq": ${{ steps.ingest.outputs.seq }}}'
      - name: stamp the head (OpenTimestamps), check, commit
        if: steps.ingest.outputs.n != '0'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/step.log") 2>&1
          s=$(printf %06d ${{ steps.ingest.outputs.seq }})
          mkdir -p ledger/anchors
          cp "${{ steps.att.outputs.bundle-path }}" ledger/anchors/$s.sigstore.json
          cp ledger/entries/$s.json "$RUNNER_TEMP/$s.json" && ots stamp "$RUNNER_TEMP/$s.json"
          mv "$RUNNER_TEMP/$s.json.ots" ledger/anchors/$s.ots
          python3 record/record.py verify
          python3 record/record.py check-anchors --ref "${{ github.ref }}" --workflow .github/workflows/record-q2.yml
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ledger
          git commit -q -m "ledger: head seq ${{ steps.ingest.outputs.seq }} sha256 ${{ steps.ingest.outputs.sha }} (run ${{ github.run_id }})"
          git pull -q --rebase origin "${{ github.ref }}"
          git push -q origin "HEAD:${{ github.ref }}"
      - name: on failure, push the log to ci-runs
        if: failure()
        run: |
          git init -q "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          mkdir -p q2-fail && cp "$RUNNER_TEMP/step.log" q2-fail/${{ github.run_id }}.log
          python3 -m pip --version >> q2-fail/${{ github.run_id }}.log 2>&1; which python3 pip ots >> q2-fail/${{ github.run_id }}.log 2>&1
          git add q2-fail && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "q2 failure log ${{ github.run_id }}"
          git push -q origin ci-runs
  q1:
    # Does `gh attestation verify -R repo` accept attestations from any workflow and branch in the repo?
    needs: append
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: try verifier flag combinations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q origin "${{ github.ref }}" || true
          R=5kasgard/exagium
          OLDP=https://exagium.dev/anchor-test/v0
          NEWP=https://github.com/5kasgard/exagium/blob/main/record/README.md#head-v1
          OLD=runs/count-2026-11-05T073638Z-0feb5e325c25.json   # attested only by anchor-test.yml on refs/heads/anchor-test
          MAIN1=ledger/entries/000001.json                       # attested by record-q2.yml on refs/heads/q2-main
          NEW=$(ls ledger/entries/*.json | tail -1)              # attested by record-q2.yml on this run's ref
          t() { f=$1; shift; if out=$(gh attestation verify "$f" -R $R "$@" 2>&1); then r=PASS; else r="FAIL ($(echo "$out" | grep -v '^$' | tail -1 | cut -c1-120))"; fi; echo "$r | $f | $*"; }
          { echo "gh $(gh --version | head -1)"; echo "ref ${{ github.ref }} run ${{ github.run_id }}"
            t $OLD --predicate-type $OLDP
            t $OLD --predicate-type $OLDP --signer-workflow $R/.github/workflows/record-q2.yml
            t $OLD --predicate-type $OLDP --source-ref refs/heads/q2-main
            t $MAIN1 --predicate-type $NEWP
            t $MAIN1 --predicate-type $NEWP --signer-workflow $R/.github/workflows/record-q2.yml --source-ref refs/heads/q2-main
            t $NEW --predicate-type $NEWP
            t $NEW --predicate-type $NEWP --signer-workflow $R/.github/workflows/record-q2.yml
            t $NEW --predicate-type $NEWP --signer-workflow $R/.github/workflows/record-q2.yml --source-ref refs/heads/q2-main
            t $NEW --predicate-type $NEWP --signer-workflow $R/.github/workflows/anchor-test.yml
            t $NEW
          } | tee q1.txt
          git init -q ci && cd ci
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          mkdir -p q1 && cp ../q1.txt q1/${{ github.run_id }}.txt && git add q1
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "q1 gh verify run ${{ github.run_id }}"
          git push -q origin ci-runs
