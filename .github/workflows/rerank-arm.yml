# P32, first test: reranked vs most-cited sources for the research reader, on the same items and the same candidate pool
# (worker/rerank_arm.py). Calls are reserved in and recorded to the shared daily ledger; results go to router-runs/arms/.
# Model replies are parsed as JSON, never run.
name: rerank-arm
on:
  workflow_dispatch:
    inputs:
      items:
        description: "research item ids, space-separated (finished items, so the worker never holds them)"
        default: "R5 R6 R7"
      reader:
        description: "reader as POOL,MODEL (same weights as the live reader, on a pool with headroom)"
        default: "openrouter,openai/gpt-oss-120b:free"   # NIM retired gpt-oss-120b on 2026-09-03 (HTTP 410, arm run 44686045805)
permissions: {}
concurrency:
  group: rerank-arm
  cancel-in-progress: false
jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: "reserve calls in the shared ledger (per item: up to 2 rerank, 2 reads, up to 12 checker calls, 2 decisions)"
        env:
          ITEMS: ${{ github.event.inputs.items }}
          READER: ${{ github.event.inputs.reader }}
        run: |
          git config --global user.name "github-actions[bot]"; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=$(echo $ITEMS | wc -w); [ "$n" -ge 1 ] && [ "$n" -le 6 ] || { echo "1 to 6 items"; exit 1; }
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/led" FETCH_HEAD
          case "$READER" in openrouter,*:free) spec="nvidia:$((n * 12)),openrouter:$((n * 6))";; nvidia,*) spec="nvidia:$((n * 14)),openrouter:$((n * 4))";; *) echo "reader pool not ledgered here"; exit 1;; esac
          python3 -I worker/ledger.py reserve "$RUNNER_TEMP/led" "arm-$GITHUB_RUN_ID" "$spec"
          git fetch -q origin pilot/lgn-20261115 && git show FETCH_HEAD:audit/2026-11-17/queue.json > "$RUNNER_TEMP/queue.json"
      - name: both arms
        env:
          ITEMS: ${{ github.event.inputs.items }}
          READER_OVERRIDE: ${{ github.event.inputs.reader }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 -I worker/rerank_arm.py "$RUNNER_TEMP/queue.json" "$RUNNER_TEMP/arm" $ITEMS 2>&1 | tee "$RUNNER_TEMP/arm.log"
      - name: record the calls in the shared ledger
        if: ${{ always() }}
        run: |
          [ -s "$RUNNER_TEMP/arm/usage.jsonl" ] || exit 0
          python3 -I worker/ledger.py record "$RUNNER_TEMP/led" "arm-$GITHUB_RUN_ID" "$RUNNER_TEMP/arm/usage.jsonl" || echo "ledger record failed"
      - name: save on router-runs
        if: ${{ always() }}
        run: |
          [ -d "$RUNNER_TEMP/arm" ] || exit 0
          cp "$RUNNER_TEMP/arm.log" "$RUNNER_TEMP/arm/" 2>/dev/null || true
          echo "$GITHUB_SHA ${{ github.event.inputs.items }} reader=${{ github.event.inputs.reader }}" > "$RUNNER_TEMP/arm/source.txt"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin router-runs && git checkout -q -B router-runs FETCH_HEAD
            mkdir -p arms && rm -rf "arms/$GITHUB_RUN_ID" && cp -r "$RUNNER_TEMP/arm" "arms/$GITHUB_RUN_ID"
            git add arms && git commit -qm "rerank arm $GITHUB_RUN_ID"
            git push -q origin router-runs && { echo "pushed on try $i"; exit 0; }
            sleep $((i * 7))
          done
          exit 1
