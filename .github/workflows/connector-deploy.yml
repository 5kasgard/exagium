# Deploys the read-only Forge connector (fabric/worker/worker.js) to Cloudflare Workers on the free plan (queue P36,
# owner 2026-11-25: a way to use the connector without running a server). Manual, main only. The worker holds no
# secrets: it reads the public repo. The Cloudflare token is in the deploy step only; wrangler is pinned by
# fabric/worker/package-lock.json (npm ci checks integrity).
name: connector-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: install wrangler (pinned)
        working-directory: fabric/worker
        run: npm ci --no-fund --no-audit
      - name: deploy
        working-directory: fabric/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.txt"; exit "${PIPESTATUS[0]}"
      - name: smoke test (no secrets)
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          echo "connector: $url/mcp" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sf -X POST "$url/mcp" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | head -c 400
