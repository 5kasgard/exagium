# Deploys the owner's Forge chat (fabric/chat) to Cloudflare Workers at chat.exagium.xyz (queue P36, 2026-11-25).
# Manual, main only. Cloudflare Access must protect chat.exagium.xyz (Allow: the owner only); the Worker also verifies
# the Access JWT itself and refuses everything else (fabric/chat/worker.js). Model keys are copied from this repo's
# secrets into Worker secrets, one step per key, each step holding the Cloudflare token and that one key.
name: chat-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: install wrangler (pinned by fabric/worker/package-lock.json)
        working-directory: fabric/worker
        run: npm ci --no-fund --no-audit
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: fabric/worker/node_modules/.bin/wrangler deploy -c fabric/chat/wrangler.toml
      - name: ACCESS_AUD
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.CHAT_ACCESS_AUD }}"}
        run: '[ -z "$V" ] && echo "not set: CHAT_ACCESS_AUD (the chat refuses every request until it is)" || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put ACCESS_AUD -c fabric/chat/wrangler.toml'
      - name: OWNER_EMAIL
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.CHAT_OWNER_EMAIL }}"}
        run: '[ -z "$V" ] && echo "not set: CHAT_OWNER_EMAIL" || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put OWNER_EMAIL -c fabric/chat/wrangler.toml'
      - name: OPENROUTER_API_KEY
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.OPENROUTER_API_KEY }}"}
        run: '[ -z "$V" ] || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put OPENROUTER_API_KEY -c fabric/chat/wrangler.toml'
      - name: GROQ_API_KEY
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.GROQ_API_KEY }}"}
        run: '[ -z "$V" ] || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put GROQ_API_KEY -c fabric/chat/wrangler.toml'
      - name: NVIDIA_API_KEY
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.NVIDIA_API_KEY }}"}
        run: '[ -z "$V" ] || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put NVIDIA_API_KEY -c fabric/chat/wrangler.toml'
      - name: ANTHROPIC_API_KEY (from CLAUDE_API_KEY)
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.CLAUDE_API_KEY }}"}
        run: '[ -z "$V" ] || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put ANTHROPIC_API_KEY -c fabric/chat/wrangler.toml'
      - name: GEMINI_API_KEY
        env: {CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", V: "${{ secrets.GEMINI_API_KEY }}"}
        run: '[ -z "$V" ] || printf %s "$V" | fabric/worker/node_modules/.bin/wrangler secret put GEMINI_API_KEY -c fabric/chat/wrangler.toml'
      - name: the chat must not be open (no secrets)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://chat.exagium.xyz/api/models)
          echo "unauthenticated /api/models: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" != 200 ]
