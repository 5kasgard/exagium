# Daily digest: the automatic handoff (queue P8) with the worker's measures (queue P9). Facts by script; a short summary
# by a free model, labelled and checked by script; written to digest/DATE.md on the worker-runs branch.
# Three jobs: facts (read-only, no keys), summary (one free-model call, read-only), write (no keys, pushes worker-runs).
name: digest
on:
  schedule:
    - cron: "23 20 * * *"   # 06:23 in Brisbane
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # loop measures: worker runs that found no ready item
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin pilot/lgn-20261115 && git worktree add -q --detach "$RUNNER_TEMP/q" FETCH_HEAD
          if git fetch -q origin worker-runs; then git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD; else mkdir -p "$RUNNER_TEMP/r"; fi
          mkdir -p out && python3 -I worker/diagnose.py scan 24 out/diagnose.json || echo "diagnose exit $?"
          python3 -I worker/digest.py facts . "$RUNNER_TEMP/q" "$RUNNER_TEMP/r" out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: facts
          path: out/
  summary:
    needs: facts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: facts
          path: out
      - name: summary (one free-model call; its text is written as Markdown, never run)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -I worker/digest.py summary out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: summary
          path: out/
  write:
    needs: [facts, summary]
    if: ${{ always() && needs.facts.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads no workspace artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: facts
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: summary
          path: out
      - name: write digest/DATE.md and record the summary's usage
        run: |
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD
          if [ -f out/calls.jsonl ]; then python3 -I worker/ledger.py record "$RUNNER_TEMP/r" "digest-$GITHUB_RUN_ID" out/calls.jsonl || echo "ledger exit $?"; fi
          python3 -I worker/digest.py write "$RUNNER_TEMP/r" out
