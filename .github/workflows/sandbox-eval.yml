# Sandbox measurement for #191 (audit/fabric/sandbox-decision-2026-11-25.md sec. 5): create once (jail and CPU checks,
# a ticking process), then every 3 h resume it from a fresh client and check files, tools and the process, then pause.
# Each provider stops itself after 10 cycles. State on the fabric-data branch:
#   E2B                    sandbox/e2b-eval.json (fabric/sandbox/e2b_eval.py)
#   Cloudflare Containers  sandbox/cf-eval.json  (fabric/sandbox/cf_eval.py through the forge-cfbox Worker, fabric/cfbox;
#                          added 2026-11-26 once the owner took Workers Paid; deploy cfbox-deploy.yml first)
name: sandbox-eval
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode: {description: "create, check or kill", default: check, type: choice, options: [create, check, kill]}
      provider: {description: "which provider", default: both, type: choice, options: [both, e2b, cf]}
permissions:
  contents: write    # the state file on fabric-data only
concurrency: {group: fabric-data, cancel-in-progress: false}
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: measure (e2b)
        if: inputs.provider != 'cf'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          if [ -f worker/PAUSE ]; then echo "worker/PAUSE is set: paused"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/data"
          if [ ! -f "$RUNNER_TEMP/fetched" ]; then   # once per job: the second step must not overwrite the first one's state
            if git fetch -q --depth 1 origin fabric-data 2>/dev/null; then git --work-tree="$RUNNER_TEMP/data" checkout FETCH_HEAD -- . ; fi
            touch "$RUNNER_TEMP/fetched"
          fi
          S="$RUNNER_TEMP/data/sandbox/e2b-eval.json"; mkdir -p "$(dirname "$S")"
          if [ "$MODE" = check ]; then
            [ -f "$S" ] || { echo "no sandbox under test"; exit 0; }
            python3 -c "import json,sys;r=json.load(open('$S'));sys.exit(0 if 'killed_at' not in r else 1)" || { echo "already ended"; exit 0; }
            n=$(python3 -c "import json;print(len(json.load(open('$S'))['cycles']))")
            if [ "$n" -ge 10 ]; then MODE=kill; fi
          fi
          if [ "$MODE" = create ] && [ -f "$S" ] && ! grep -q killed_at "$S"; then echo "a sandbox is already under test"; exit 1; fi
          python3 -m venv "$RUNNER_TEMP/v" && "$RUNNER_TEMP/v/bin/pip" install -q e2b==2.46.0   # python3 -I skips user site-packages (first run: no module e2b)
          set -o pipefail
          "$RUNNER_TEMP/v/bin/python" -I fabric/sandbox/e2b_eval.py "$MODE" "$S" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=1" >> "$GITHUB_ENV"
      - name: measure (cloudflare containers)
        if: always() && inputs.provider != 'e2b'
        env:
          CFBOX_TOKEN: ${{ secrets.FORGE_BOX_TOKEN }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          if [ -f worker/PAUSE ]; then echo "worker/PAUSE is set: paused"; exit 0; fi
          [ -n "$CFBOX_TOKEN" ] || { echo "FORGE_BOX_TOKEN not set"; exit 0; }
          mkdir -p "$RUNNER_TEMP/data"
          if [ ! -f "$RUNNER_TEMP/fetched" ]; then   # once per job: the second step must not overwrite the first one's state
            if git fetch -q --depth 1 origin fabric-data 2>/dev/null; then git --work-tree="$RUNNER_TEMP/data" checkout FETCH_HEAD -- . ; fi
            touch "$RUNNER_TEMP/fetched"
          fi
          S="$RUNNER_TEMP/data/sandbox/cf-eval.json"; mkdir -p "$(dirname "$S")"
          if [ "$MODE" = check ]; then
            [ -f "$S" ] || { echo "no cloudflare sandbox under test"; exit 0; }
            if grep -q killed_at "$S"; then echo "cloudflare: already ended"; exit 0; fi
            n=$(python3 -c "import json;print(len(json.load(open('$S'))['snap']['cycles']))")
            if [ "$n" -ge 10 ]; then MODE=kill; fi
          fi
          if [ "$MODE" = create ] && [ -f "$S" ] && ! grep -q killed_at "$S"; then echo "a cloudflare sandbox is already under test"; exit 1; fi
          set -o pipefail
          python3 -I fabric/sandbox/cf_eval.py "$MODE" "$S" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=1" >> "$GITHUB_ENV"
      - name: publish state to fabric-data
        if: always() && env.changed == '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cd "$RUNNER_TEMP/data"
          git init -q && git checkout -q -b fabric-data && git add -A
          git -c user.name=forge-dash -c user.email=forge-dash@users.noreply.github.com commit -q -m "sandbox eval (run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fabric-data
