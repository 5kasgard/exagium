name: confirm
# Queue P5b: retrain P5's top proposals and the baselines on 80% of train and score them on the held-out 20%
# (runner/proposals/confirm/PLAN.md, fixed before the first run). No secrets; generated code runs only in the jail.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: confirm
  cancel-in-progress: false
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq valgrind bubblewrap
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.5.3
          python3 -m unittest runner/proposals/confirm/test_decide.py runner/proposals/test_proposals.py
      - name: the five proposals fixed in PLAN.md, from the proposals branch at 3a8dc25
        run: |
          git fetch -q --depth 1 origin 3a8dc252b5f99416f86ef6b692ab29fac8968e6a
          for p in prop-44492370928-2 prop-44587812936-1 prop-44610648477-1 prop-44549931886-1 prop-44601956368-1; do
            git show "FETCH_HEAD:proposals/$p/reply.md" > "$RUNNER_TEMP/$p.md"
            st=$(python3 -I runner/proposals/extract.py "$RUNNER_TEMP/$p.md" "runner/candidates/$p" | tail -1)
            echo "$p: $st"; [ "$st" = extracted ] || exit 1
          done
          git show FETCH_HEAD:proposals/LEADERBOARD.md > "$RUNNER_TEMP/LEADERBOARD.md"
      - name: build digits, make the confirmation split, evaluate (3 rounds), decide
        run: |
          set -o pipefail   # a failed evaluate must fail the job (first run hid it behind tail)
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -I tasks/build.py "$RUNNER_TEMP/built" --cache "$RUNNER_TEMP/dl" --only optdigits
          python3 -I runner/proposals/confirm/split.py "$RUNNER_TEMP/built" optdigits "$RUNNER_TEMP/conf" 20261120 tasks
          mkdir -p out
          "$PY" runner/run.py evaluate --data "$RUNNER_TEMP/conf" --task optdigits-confirm --split dev --rounds 3 \
            --cand majority label-linear label-mlp16 label-gbdt \
                   prop-44492370928-2 prop-44587812936-1 prop-44610648477-1 prop-44549931886-1 prop-44601956368-1 \
            --out out/confirm.json 2>&1 | tail -n 20
          python3 -I runner/proposals/confirm/decide.py out/confirm.json "$RUNNER_TEMP/LEADERBOARD.md" | tee out/DECISION.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: confirm
          path: out/
