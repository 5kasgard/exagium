# Queue P5: free models propose candidates; rules in runner/proposals/PLAN.md. Self-continuing until the plan's first 20
# proposals exist: each finished batch starts the next; a batch stopped by the free-call budget hands over to keeper.yml,
# which starts this workflow again when the daily caps reset (no dependence on GitHub's scheduler, queue Q58).
# reserve (ledger, no key) -> propose (key, runs no generated code) -> score (no secrets, read-only, generated code runs
# only in the jail) -> record (no key; writes the proposals branch and the ledger).
name: propose
on:
  workflow_dispatch:
    inputs:
      n:
        description: "proposals in this run (1-3)"
        default: "3"
      start:
        description: "task rotation start (0 optdigits, 1 text, 2 adult)"
        default: "0"
      rescore:
        description: "run id of an earlier propose run: score its saved replies again, with no new calls"
        default: ""
      dry:
        description: "1 = no model call: the reply is a known-good example; tests the path, writes no leaderboard or ledger"
        default: "0"
permissions: {}
concurrency:
  group: propose${{ github.event.inputs.dry == '1' && '-dry' || '' }}   # a dry run never waits behind, or displaces, a real batch
  cancel-in-progress: false
env:
  FIRST_N: 20   # PLAN.md: the keep/switch rule is applied after the first 20 proposals; the chain stops there
  RUN: propose-${{ github.run_id }}
  SRC: ${{ github.event.inputs.rescore || github.run_id }}   # the run whose replies are scored and named
  RESCORE: ${{ github.event.inputs.rescore }}
  DRY: ${{ github.event.inputs.dry }}
jobs:
  reserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the ledger on worker-runs
      actions: write    # hand over to keeper.yml when the budget is used up
    outputs:
      n: ${{ steps.res.outputs.n }}
      start: ${{ steps.res.outputs.start }}
      ks: ${{ steps.res.outputs.ks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes the ledger with the checkout token and uploads no artifact
      - name: reserve one free call per proposal
        id: res
        env:
          N_IN: ${{ github.event.inputs.n }}
          START_IN: ${{ github.event.inputs.start }}
        run: |
          case "$N_IN" in 1|2|3) ;; *) echo "n must be 1, 2 or 3"; exit 1 ;; esac
          case "$START_IN" in 0|1|2) ;; *) echo "start must be 0, 1 or 2"; exit 1 ;; esac
          case "$DRY" in 0|1) ;; *) echo "dry must be 0 or 1"; exit 1 ;; esac
          echo "ks=$(python3 -c "import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))" "$N_IN")" >> "$GITHUB_OUTPUT"   # one score job per proposal
          case "$RESCORE" in "") ;; *[!0-9]*) echo "rescore must be a run id"; exit 1 ;; *) { echo "n=$N_IN"; echo "start=$START_IN"; } >> "$GITHUB_OUTPUT"; echo "rescore: no calls reserved"; exit 0 ;; esac
          if [ "$DRY" = 1 ]; then { echo "n=$N_IN"; echo "start=$START_IN"; } >> "$GITHUB_OUTPUT"; echo "dry run: no calls reserved"; exit 0; fi
          if [ -f worker/PAUSE ]; then echo "paused by worker/PAUSE"; exit 1; fi
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD
          rc=0; python3 -I worker/ledger.py reserve "$RUNNER_TEMP/r" "$RUN" "nvidia:$N_IN" || rc=$?
          if [ "$rc" != 0 ]; then
            echo "no budget for $N_IN calls today (ledger exit $rc): handing over to keeper.yml for 00:05 UTC"
            GH_TOKEN="${{ github.token }}" gh workflow run keeper.yml -R "${{ github.repository }}" --ref main \
              -f at="$(date -u -d 'tomorrow 00:05' +%s)" -f workflow=propose.yml
            echo "n=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "n=$N_IN"; echo "start=$START_IN"; } >> "$GITHUB_OUTPUT"
  propose:
    needs: reserve
    if: ${{ github.event.inputs.rescore == '' && needs.reserve.outputs.n != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: one call per proposal (Nemotron 3 Ultra, NVIDIA NIM free)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          N: ${{ needs.reserve.outputs.n }}
          START: ${{ needs.reserve.outputs.start }}
        run: |
          if [ "$DRY" = 1 ]; then python3 -I runner/proposals/propose.py out "$N" "$START" --dry
          else python3 -I runner/proposals/propose.py out "$N" "$START"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: replies
          path: out/
  score:
    needs: [reserve, propose]
    if: ${{ always() && needs.reserve.result == 'success' && needs.reserve.outputs.n != '0' && (needs.propose.result == 'success' || needs.propose.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120   # one proposal per job: 2 trainings + 1 evaluation, each under the jail's 30 min CPU limit
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.reserve.outputs.ks) }}   # proposals scored in parallel, one job each (owner, 2026-11-19)
    permissions:
      contents: read
      actions: read   # the replies artifact of an earlier run when rescoring
    env:
      K: ${{ matrix.k }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: replies
          path: out
          run-id: ${{ env.SRC }}
          github-token: ${{ github.token }}
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind bubblewrap
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.5.3
          python3 -m unittest runner/proposals/test_proposals.py
      - name: extract, reproduce and score this proposal on dev, in the jail
        run: |
          PY="$RUNNER_TEMP/venv/bin/python"
          for k in "$K"; do
            [ -f "out/$k/task" ] || continue
            task=$(cat "out/$k/task"); case "$task" in optdigits|text|adult) ;; *) echo "bad task"; exit 1 ;; esac
            name="prop-$SRC-$k"
            st=$(python3 -I runner/proposals/extract.py "out/$k/reply.md" "runner/candidates/$name" | tail -1) || true
            echo "$name ($task): $st"
            if [ "$st" = extracted ]; then
              [ -d "$RUNNER_TEMP/built/$task" ] || "$PY" -I tasks/build.py "$RUNNER_TEMP/built" --cache "$RUNNER_TEMP/dl" --only "$task"
              "$PY" runner/run.py reproduce --data "$RUNNER_TEMP/built" --task "$task" --cand "$name" \
                --out "out/$k/reproduce.json" > "out/$k/reproduce.txt" 2>&1 || true
              "$PY" runner/run.py evaluate --data "$RUNNER_TEMP/built" --task "$task" --cand majority label-linear "$name" \
                --split dev --rounds 3 --out "out/$k/dev.json" > "out/$k/dev.txt" 2>&1 || true
              tail -n 5 "out/$k/reproduce.txt" "out/$k/dev.txt" || true
            fi
            python3 -I runner/proposals/judge.py one "$name" "$st" "out/$k/reproduce.json" "out/$k/dev.json" "out/$k/result.json" "$task"
          done
          # keep the proposal's folder name inside the artifact (a marker file one level up sets the artifact's root)
          mkdir -p staged && cp -r "out/$K" "staged/$K" && echo "$K" > "staged/k-$K.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: scored-${{ matrix.k }}
          path: staged/
  record:
    needs: [reserve, propose, score]
    if: ${{ always() && needs.reserve.result == 'success' && needs.reserve.outputs.n != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the proposals branch and the ledger
      actions: write    # the replies artifact of an earlier run when rescoring; start the next batch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads no artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          pattern: scored-*
          merge-multiple: true
          path: scored
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: replies
          path: replies
          run-id: ${{ env.SRC }}
          github-token: ${{ github.token }}
      - name: ledger, proposals branch and leaderboard
        env:
          N: ${{ needs.reserve.outputs.n }}
          START: ${{ needs.reserve.outputs.start }}
        run: |
          if [ "$DRY" = 1 ]; then   # test the merge and the board only: nothing is pushed, no ledger, no chain
            mkdir -p "$RUNNER_TEMP/dry/proposals"
            for k in $(seq 0 $((N - 1))); do mkdir -p "$RUNNER_TEMP/dry/proposals/prop-dry-$k"; cp scored/$k/result.json "$RUNNER_TEMP/dry/proposals/prop-dry-$k/"; done
            python3 -I runner/proposals/judge.py board "$RUNNER_TEMP/dry/proposals"; cat "$RUNNER_TEMP/dry/proposals/LEADERBOARD.md"; exit 0
          fi
          git config --global user.name exagium-worker; git config --global user.email worker@exagium.invalid
          git fetch -q origin worker-runs && git worktree add -q --detach "$RUNNER_TEMP/r" FETCH_HEAD
          if [ -z "$RESCORE" ] && [ -f replies/calls.jsonl ]; then python3 -I worker/ledger.py record "$RUNNER_TEMP/r" "$RUN" replies/calls.jsonl || echo "ledger record exit $?"; fi
          src=scored; [ -d scored ] || src=replies
          for t in 1 2 3; do
            if git ls-remote --exit-code origin proposals >/dev/null; then
              git fetch -q origin proposals && git worktree add -q --detach "$RUNNER_TEMP/p$t" FETCH_HEAD
            else
              git worktree add -q --orphan -b "proposals-$t" "$RUNNER_TEMP/p$t"
            fi
            P="$RUNNER_TEMP/p$t"
            for k in $(seq 0 $((N - 1))); do
              [ -f "replies/$k/task" ] || continue
              d="$P/proposals/prop-$SRC-$k"; mkdir -p "$d"
              for f in task prompt.md reply.md reproduce.txt dev.txt result.json; do   # at most 2 MB each (review 44486820706, 6)
                [ -f "$src/$k/$f" ] && [ "$(stat -c %s "$src/$k/$f")" -le 2000000 ] && cp "$src/$k/$f" "$d/" || true
              done
              [ -f "$src/$k/result.json" ] || python3 -I runner/proposals/judge.py one "prop-$SRC-$k" "not scored" x x "$d/result.json"
            done
            python3 -I runner/proposals/judge.py board "$P/proposals"
            git -C "$P" add -A && git -C "$P" commit -qm "proposals: $RUN" && git -C "$P" push -q origin HEAD:proposals && break
            echo "push failed, retrying"; sleep 5
          done
          cat "$P/proposals/LEADERBOARD.md" >> "$GITHUB_STEP_SUMMARY"
          # continue until the plan's first FIRST_N proposals exist (no chain from a rescore)
          have=$(find "$P/proposals" -maxdepth 1 -type d -name 'prop-*' | wc -l)
          if [ -z "$RESCORE" ] && [ "$have" -lt "$FIRST_N" ]; then
            n=$(( FIRST_N - have < 3 ? FIRST_N - have : 3 )); start=$(( (START + N) % 3 ))
            GH_TOKEN="${{ github.token }}" gh workflow run propose.yml -R "${{ github.repository }}" --ref main -f n="$n" -f start="$start"
            echo "next batch started: $n proposals from task $start ($have of $FIRST_N so far)"
          else
            echo "$have proposals: not chaining (first $FIRST_N reached, or a rescore)"
          fi
