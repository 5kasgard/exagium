# The first loop, on hosts the owner doesn't control. Each job lands on whatever runner is free and:
#   1. retrains every baseline and candidate in loop.py's jail (bubblewrap: no network, no repo, only the
#      training file) and checks the weights are byte-identical to the frozen ones (loop.py reproduce);
#   2. scores them on the dev split (the last 25% of the training file);
#   3. for each request in loop/verify/, scores the named candidates on the test set, which loop.py only
#      does when the ledger holds a plan that froze exactly those files. A request is removed once its plan has a
#      verdict. Each step's output ends with its exit code.
# A final job commits every job's output to the ci-runs branch (loop/<run id>/), so results stay in git.
name: loop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["loop/**", ".github/workflows/loop.yml"]
permissions:
  contents: read
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        slot: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # loop.py verifies the ledger before scoring the test set
          persist-credentials: false   # no token left in .git/config
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which the jail needs
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy==2.5.3 sigstore==4.5.1 opentimestamps-client==0.8.0
          mkdir -p out && { echo "${ImageOS:-} ${ImageVersion:-}"; gcc --version | head -1; valgrind --version; nproc; } > out/host.txt
          grep -m1 -E 'model name|CPU part' /proc/cpuinfo >> out/host.txt || true
      - name: reproduce training (in the jail)
        run: |
          dirs=$(ls -d loop/baselines/*/ loop/candidates/*/ 2>/dev/null || true)
          { "$RUNNER_TEMP/venv/bin/python" loop/loop.py reproduce $dirs --out out/reproduce.json 2>&1; echo "exit $?"; } | tee out/reproduce.txt || true
      - name: score on the dev split
        run: |
          dirs=$(ls -d loop/baselines/*/ loop/candidates/*/ 2>/dev/null || true)
          { "$RUNNER_TEMP/venv/bin/python" loop/loop.py evaluate $dirs --test dev --records out/records --out out/dev.json 2>&1; echo "exit $?"; } | tee out/dev.txt || true
      - name: score requested plans on the test set
        run: |
          for req in loop/verify/*.json; do
            [ -e "$req" ] || continue
            plan=$(python3 -c "import json,sys; print(int(json.load(open(sys.argv[1]))['plan']))" "$req")
            mapfile -t dirs < <(python3 -c "import json,sys; [print(d) for d in json.load(open(sys.argv[1]))['candidates']]" "$req")
            mapfile -t opts < <(python3 -c "import json,sys; r=json.load(open(sys.argv[1])); [print(x) for k in ('rounds','seed') if k in r for x in ('--'+k, int(r[k]))]" "$req")
            { "$RUNNER_TEMP/venv/bin/python" loop/loop.py evaluate "${dirs[@]}" --test test --plan "$plan" "${opts[@]}" --records out/records \
              --out "out/test-plan$plan.json" 2>&1; echo "exit $?"; } | tee "out/test-plan$plan.txt" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: loop-${{ matrix.runner }}-${{ matrix.slot }}
          path: out
  docker:
    # The jail's fallback (confine: Landlock + seccomp) inside a stock container with Docker's default seccomp
    # profile, where bubblewrap can't make its namespaces. Records which jail mode loop.py chose.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: tools
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git gcc valgrind bubblewrap python3 python3-venv >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: host and jail mode
        run: |
          git config --global --add safe.directory "$PWD"
          python3 -m venv /opt/venv && /opt/venv/bin/pip install -q numpy==2.5.3
          mkdir -p out && { uname -r; id -u; grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true; grep Seccomp: /proc/self/status; } > out/host.txt
          { bwrap --unshare-all --ro-bind / / true 2>&1; echo "bwrap exit $?"; } >> out/host.txt || true
          /opt/venv/bin/python -c "import sys; sys.path.insert(0, 'loop'); import loop; loop.check_jail(); print('jail mode', loop.JAIL['mode'], '| bwrap:', loop.JAIL['bwrap_error'])" >> out/host.txt 2>&1 || true
          cat out/host.txt
      - name: valgrind under confine (diagnostic)
        run: |
          gcc -O2 -o /tmp/confine loop/confine.c
          ro="--ro /usr --ro /lib --ro /bin --ro /etc/ld.so.cache --ro /dev/urandom --rw /dev/null --rw /tmp"
          for extra in "--ro /proc/self" "--ro /proc/self --ro /proc/cpuinfo"; do
            echo "== confine $extra"
            /tmp/confine $ro $extra -- /usr/bin/valgrind -v --tool=cachegrind --cachegrind-out-file=/dev/null /bin/true 2>&1 | tail -8
            echo "exit ${PIPESTATUS[0]}"
          done 2>&1 | tee out/valgrind-confine.txt || true
      - name: loop tests
        run: |
          { cd loop && /opt/venv/bin/python -m unittest test_loop 2>&1; echo "exit $?"; } | tee out/tests.txt || true
      - name: reproduce and score on the dev split
        run: |
          dirs=$(ls -d loop/baselines/*/ loop/candidates/*/)
          { /opt/venv/bin/python loop/loop.py reproduce $dirs --out out/reproduce.json 2>&1; echo "exit $?"; } | tee out/reproduce.txt || true
          { /opt/venv/bin/python loop/loop.py evaluate $dirs --test dev --rounds 10 --records out/records --out out/dev.json 2>&1; echo "exit $?"; } | tee out/dev.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: loop-docker-${{ matrix.runner }}
          path: out
  collect:
    needs: [run, docker]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: commit results to ci-runs
        run: |
          git init -q ci && cd ci
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          d=loop/${{ github.run_id }}; mkdir -p $d
          cp -r ../art/* $d/ 2>/dev/null || echo "no job produced output" > $d/none.txt; echo "${{ github.sha }}" > $d/commit.txt
          git add loop
          git -c user.name=github-actions -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "loop run ${{ github.run_id }} at ${{ github.sha }}"
          for i in 1 2 3; do git push -q origin ci-runs && break; git pull -q --rebase origin ci-runs; done
