name: decisions-probe
# Queue P31: score an OpenRouter Decisions model on the known-answer grading set. Sends prompt text only; no generated code runs.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Decisions model id"
        default: "perplexity/pplx-decider-v1.3:free"
      mode:
        description: "per-item (one request per item) or batch (one request per file, a question per item)"
        default: "batch"
      parts:
        description: "which halves: docs2, cards2 or both (free models allow 50 requests a day: 27 + 8)"
        default: "cards2"
      checker:
        description: "breadth / breadth-dry = search-breadth test, relinstr = relevance-filter instruction test, relcontrol = relevance-filter control replay, 1 = research-checker probe, route = tier-routing probe (router/review/tier-routing); 1 = run the research-checker probe instead (router/decisions_checker_probe.py, known answers in checker-relevance/PLAN.md)"
        default: "0"
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: run both halves of the grading set
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
          PARTS: ${{ github.event.inputs.parts }}
          MODE: ${{ github.event.inputs.mode }}
          CHECKER: ${{ github.event.inputs.checker }}
        run: |
          case "$MODEL" in *[!A-Za-z0-9._:/-]*|'') echo "bad model id"; exit 1 ;; esac
          mkdir -p out
          if [ "$CHECKER" = breadth ] || [ "$CHECKER" = breadth-dry ]; then   # keyless metasearch vs current search (search-breadth/PLAN.md)
            docker run -d --name sx -p 127.0.0.1:8080:8080 -v "$PWD/router/review/search-breadth/searxng:/etc/searxng:ro" \
              searxng/searxng:2026.11.21-c6ee3e9fd@sha256:fc1d81d7e9d04d3c8b3e23c7162feddf5c3d6aecd32e67a56eaabcb8d8747f79
            for i in $(seq 1 30); do curl -sf "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null && break; sleep 2; done
            dry=""; [ "$CHECKER" = breadth-dry ] && dry="--dry"
            python3 -I router/review/search-breadth/breadth.py out/breadth.json $dry || true
            docker logs sx 2>&1 | tail -40 > out/searxng.log; exit 0
          fi
          if [ "$CHECKER" = relinstr ]; then   # relevance-filter instruction variants vs labelled pools (relevance-control/PLAN-instruction.md)
            python3 -I router/review/relevance-control/instr.py out/relinstr.json; exit 0
          fi
          if [ "$CHECKER" = relcontrol ]; then   # research relevance filter's controls, replayed on frozen pools (router/review/relevance-control/PLAN.md)
            python3 -I router/review/relevance-control/replay.py router/review/relevance-control/pools.json out/relcontrol.json
            python3 -I router/review/relevance-control/replay.py router/review/relevance-control/pools.json out/relcontrol-prod.json --prod; exit 0
          fi
          if [ "$CHECKER" = route ]; then
            python3 -I router/decisions_route.py "$MODEL" router/review/tier-routing/cases.json out/route.json; exit 0
          fi
          if [ "$CHECKER" = 1 ]; then
            python3 -I router/decisions_checker_probe.py "$MODEL" out/checker.json \
              router/review/checker-relevance/A2-R10-narrow.md:KKD router/review/checker-relevance/B-R4.md:DDD
            exit 0
          fi
          case "$PARTS" in docs2|cards2) list="$PARTS" ;; both) list="docs2 cards2" ;; *) echo "bad parts"; exit 1 ;; esac
          for p in $list; do case "$MODE" in per-item|batch) ;; *) echo "bad mode"; exit 1 ;; esac
            python3 -I router/decisions_probe.py "$MODEL" "router/review/grade-rt2/$p.md" "out/$p.json" "$MODE"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: decisions
          path: out/
