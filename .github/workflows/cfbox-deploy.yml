# Deploys forge-cfbox (fabric/cfbox/worker.js): the Cloudflare Containers side of the sandbox measurement (#191,
# audit/fabric/sandbox-decision-2026-11-25.md). Needs Workers Paid (owner, 2026-11-26). Manual, main only. wrangler
# builds the image with the runner's Docker and pushes it to Cloudflare's registry. One secret goes into the Worker:
#   FORGE_BOX_TOKEN -> BOX_TOKEN   the same trust domain as forge-box (both run code in a sandbox; neither holds a repo token)
name: cfbox-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: install (pinned wrangler, lockfile)
        working-directory: fabric/cfbox
        run: npm ci --ignore-scripts --no-fund --no-audit   # no install scripts before the secret steps
      - name: tests
        run: node fabric/cfbox/test_cfbox.mjs
      - name: deploy
        working-directory: fabric/cfbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy > "$RUNNER_TEMP/deploy.txt" 2>&1 || {
            grep -iE -A6 "error|fail|permission|auth|code:" "$RUNNER_TEMP/deploy.txt" | sed -E 's#https?://[^ ]*#<url>#g; s#[a-z0-9-]+\.workers\.dev#<workers.dev>#g' | tail -n 40; exit 1; }
          grep -iE "container|image|uploaded|deployed" "$RUNNER_TEMP/deploy.txt" | grep -v -iE "workers\.dev|https?://" | tail -n 10
      - name: secret BOX_TOKEN
        working-directory: fabric/cfbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          V: ${{ secrets.FORGE_BOX_TOKEN }}
        run: |
          [ -n "$V" ] || { echo "FORGE_BOX_TOKEN not set: every call will be refused (401)"; exit 0; }
          printf '%s' "$V" | npx --no-install wrangler secret put BOX_TOKEN > /dev/null 2>&1 && echo "BOX_TOKEN: set"
      - name: smoke test (refuses without the token, refuses a bad request with it; starts no container)
        env: {T: "${{ secrets.FORGE_BOX_TOKEN }}"}
        run: |
          url=https://cfbox.exagium.xyz/check
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url?mode=snap")
          echo "without token: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          code2=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url?mode=bogus" -H "authorization: Bearer $T")
          echo "with token, bad mode: HTTP $code2" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = 401 ] && [ "$code2" = 400 ]
