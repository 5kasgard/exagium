# Keeps the owner's LobeHub workbench in step with fabric/workbench/config/workbench.json through LobeHub's CLI
# (owner 2026-11-25). Manual, main only: `status` reads (providers, models, connectors, agents); `apply` makes the
# connectors and the forge-managed agents match the merged config. The CLI signs in with LOBEHUB_CLI_API_KEY (the
# owner's key, made in the workbench's Settings > API Keys); manage.py prints no email, key or header.
name: workbench-manage
on:
  workflow_dispatch:
    inputs:
      mode: {description: "status or apply", default: status, type: choice, options: [status, apply]}
permissions:
  contents: read
jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: lh CLI (pinned)
        run: npm i -g --no-fund --no-audit @lobehub/cli@0.0.234 > /dev/null   # zizmor: ignore[adhoc-packages] version pinned
      - name: sign in and ${{ inputs.mode }}
        env:
          LOBEHUB_CLI_API_KEY: ${{ secrets.LOBEHUB_CLI_API_KEY }}
          FORGE_ACT_TOKEN: ${{ secrets.FORGE_ACT_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          lh login --server https://workbench.exagium.xyz > "$RUNNER_TEMP/login.log" 2>&1 || { echo "login failed: $(tail -n 1 "$RUNNER_TEMP/login.log" | grep -v -iE '@|key')"; exit 1; }
          if [ "$MODE" = apply ]; then python3 -I fabric/workbench/manage.py apply fabric/workbench/config/workbench.json
          else python3 -I fabric/workbench/manage.py status; fi
