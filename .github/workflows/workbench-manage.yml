# Keeps the owner's LobeHub workbench in step with fabric/workbench/config/workbench.json through LobeHub's CLI
# (owner 2026-11-25). Manual, main only: `status` reads (providers, models, connectors, agents); `apply` makes the
# connectors and the forge-managed agents match the merged config. The CLI signs in with LOBEHUB_CLI_API_KEY (the
# owner's key, made in the workbench's Settings > API Keys); manage.py prints no email, key or header.
name: workbench-manage
on:
  workflow_dispatch:
    inputs:
      mode: {description: "status or apply", default: status, type: choice, options: [status, apply, errors, run, probe]}
      agent: {description: "for run: agent key (lead, free, research, coder)", default: free}
      prompt: {description: "for run: the prompt", default: ""}
      topic: {description: "for run: continue this LobeHub topic (a reply in Discord); empty = new chat", default: ""}
permissions:
  contents: read
jobs:
  manage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: lh CLI (pinned)
        run: npm i -g --no-fund --no-audit @lobehub/cli@0.0.234 > /dev/null   # zizmor: ignore[adhoc-packages] version pinned
      - name: sign in and ${{ inputs.mode }}
        env:
          LOBEHUB_CLI_API_KEY: ${{ secrets.LOBEHUB_CLI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # replies go to the owner's private Discord
          FORGE_ACT_TOKEN: ${{ secrets.FORGE_ACT_TOKEN }}
          MODE: ${{ inputs.mode }}
          AGENT: ${{ inputs.agent }}
          PROMPT: ${{ inputs.prompt }}
          TOPIC: ${{ inputs.topic }}
        run: |
          t0=$(date +%s)
          lh login --server https://workbench.exagium.xyz > "$RUNNER_TEMP/login.log" 2>&1 || { echo "login failed: $(tail -n 1 "$RUNNER_TEMP/login.log" | grep -v -iE '@|key')"; exit 1; }
          echo "timing: login $(( $(date +%s) - t0 )) s"
          if [ "$MODE" = apply ]; then python3 -I fabric/workbench/manage.py apply fabric/workbench/config/workbench.json
          elif [ "$MODE" = errors ]; then python3 -I fabric/workbench/manage.py errors 2
          elif [ "$MODE" = run ]; then python3 -I fabric/workbench/manage.py run "$AGENT" "$PROMPT" "$TOPIC"
          elif [ "$MODE" = probe ]; then FORGE_STREAM_PROBE=1 python3 -I fabric/workbench/manage.py run "$AGENT" "$PROMPT"
          else python3 -I fabric/workbench/manage.py status; fi
