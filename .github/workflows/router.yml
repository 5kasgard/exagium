# Free-engine router. For now: a probe that makes one exact-answer call to each free engine
# (OpenRouter, Cloudflare Workers AI, Gemini via AI Studio) using the repository secrets, and
# appends the records to router/log/calls.jsonl on the router-runs branch. Keys are never printed.
name: router
on:
  push:
    branches: [main]
    paths: ["router/engines.py", "router/probe.py", ".github/workflows/router.yml"]
  workflow_dispatch:
concurrency:
  group: router
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads no workspace artifact
      - name: "today's paid calls so far (queue P4): the daily cap counts router-runs' call log, not just this run"
        id: seed
        run: |
          # fail closed: without today's history the daily cap would start from 0, so paid pools stay off (review 44393174128, 2)
          if git fetch -q origin router-runs && git show FETCH_HEAD:router/log/calls.jsonl > "$RUNNER_TEMP/usage.jsonl"; then
            echo "pools=cerebras,xai,gemini" >> "$GITHUB_OUTPUT"; wc -l < "$RUNNER_TEMP/usage.jsonl"
          else
            echo "pools=" >> "$GITHUB_OUTPUT"; : > "$RUNNER_TEMP/usage.jsonl"; echo "no call history: paid pools off for this run"
          fi
      - name: probe every engine
        env:
          # queue P4: paid pools this workflow may call, under engines.PAID's per-call and daily caps. Two probe runs at
          # once can each see the same count, so a day can exceed a cap by one run's calls (at most 4 per pool).
          ROUTER_PAID_POOLS: ${{ steps.seed.outputs.pools }}
          ROUTER_USAGE_LOG: ${{ runner.temp }}/usage.jsonl
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_BASE_URL: ${{ secrets.NARA_BASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          INFERBASE_API_KEY: ${{ secrets.INFERBASE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CROWLLM_API_KEY: ${{ secrets.CROWLLM_API_KEY }}
          CROWLLM_BASE_URL: ${{ secrets.CROWLLM_BASE_URL }}
        run: |
          rc=0; python3 -I router/probe.py "$RUNNER_TEMP/probe.jsonl" || rc=$?
          echo "exit $rc"; echo "rc=$rc" >> "$GITHUB_ENV"
      - name: append the records to router-runs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rebuild on the newest router-runs and retry: other workflows push there too (audit Q18)
          for i in 1 2 3 4 5; do
            if git fetch -q origin router-runs; then git checkout -q -B router-runs FETCH_HEAD; else git checkout -q --orphan router-runs && git rm -rqf . ; fi
            mkdir -p router/log && touch router/log/calls.jsonl
            [ -f "$RUNNER_TEMP/probe.jsonl" ] && sed "s/^{/{\"run\": \"$GITHUB_RUN_ID\", /" "$RUNNER_TEMP/probe.jsonl" >> router/log/calls.jsonl
            git add router/log/calls.jsonl
            git commit -qm "router probe, run $GITHUB_RUN_ID" && git push -q origin router-runs && { echo "pushed on try $i"; exit 0; }
            sleep $((i * 7))
          done
          exit 1
      - name: fail if the probe failed
        run: exit "$rc"
