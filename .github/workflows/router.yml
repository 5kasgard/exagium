# Free-engine router. For now: a probe that makes one exact-answer call to each free engine
# (OpenRouter, Cloudflare Workers AI, Gemini via AI Studio) using the repository secrets, and
# appends the records to router/log/calls.jsonl on the router-runs branch. Keys are never printed.
name: router
on:
  push:
    branches: [main]
    paths: ["router/engines.py", "router/probe.py", ".github/workflows/router.yml"]
  workflow_dispatch:
concurrency:
  group: router
  cancel-in-progress: false
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: probe every engine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_BASE_URL: ${{ secrets.NARA_BASE_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          INFERBASE_API_KEY: ${{ secrets.INFERBASE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CROWLLM_API_KEY: ${{ secrets.CROWLLM_API_KEY }}
          CROWLLM_BASE_URL: ${{ secrets.CROWLLM_BASE_URL }}
        run: |
          rc=0; python3 -I router/probe.py "$RUNNER_TEMP/probe.jsonl" || rc=$?
          echo "exit $rc"; echo "rc=$rc" >> "$GITHUB_ENV"
      - name: append the records to router-runs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin router-runs; then git checkout -q -B router-runs FETCH_HEAD; else git checkout -q --orphan router-runs && git rm -rqf . ; fi
          mkdir -p router/log && touch router/log/calls.jsonl
          [ -f "$RUNNER_TEMP/probe.jsonl" ] && sed "s/^{/{\"run\": \"$GITHUB_RUN_ID\", /" "$RUNNER_TEMP/probe.jsonl" >> router/log/calls.jsonl
          git add router/log/calls.jsonl
          git commit -qm "router probe, run $GITHUB_RUN_ID" && git push -q origin router-runs
          echo "exit 0"
      - name: fail if the probe failed
        run: exit "$rc"
