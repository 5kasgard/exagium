# The ledger's only writer. A push that adds proposals to ledger/inbox/ makes this job:
#   1. run exactly the commit that triggered it (the commit its certificate names), or step aside if the
#      branch has moved on (the newer run will take the proposals);
#   2. refuse to go on unless every existing entry is already covered by this workflow's attestations
#      (so an entry written by hand is never vouched for later);
#   3. ingest the proposals; stamp the new head with OpenTimestamps; refuse to attest if the branch moved;
#   4. attest the exact range of entries it added (Sigstore, public Rekor); check every anchor; commit.
#   If the run fails or is cancelled after attesting but before the ledger commit succeeds, the bundle and
#   entries go to the ci-runs branch, so the orphaned attestation can be explained with its real statement
#   and entries (a cancel landing mid-push can file a committed one there too: a harmless duplicate).
#   A refused proposal stays in ledger/inbox/ and fails the run after the good ones are committed.
# The daily run also ingests any proposals a stepped-aside run left behind. Actions are pinned by commit;
# record.py runs with python3 -I so nothing next to it can shadow the standard library.
# A daily job completes pending OpenTimestamps proofs.
# Verifiers pin this identity: https://github.com/5kasgard/exagium/.github/workflows/record.yml@refs/heads/main
name: "record-e2e (test copy of record.yml - same steps, its own branch and identity)"
on:
  push:
    branches: [e2e-main]
    paths: ["ledger/inbox/**"]
  workflow_dispatch:
env:
  LEDGER_REF: e2e-main
  WRITER: .github/workflows/record-e2e.yml
concurrency:
  group: record-e2e-writer   # one writer at a time, across every ref
  cancel-in-progress: false
permissions: {}   # each job asks for what it needs (audit Q07)
defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command in a pipe fails the step
jobs:
  append:   # also on the daily schedule and by hand, so proposals stranded by a stepped-aside run are picked up
    runs-on: ubuntu-24.04
    permissions:   # signs attestations and pushes the ledger
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0   # github.sha: the commit the certificate will name  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads no workspace artifact
      - name: step aside if the branch has moved on
        id: current
        run: |
          git fetch -q origin "$LEDGER_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "superseded by $(git rev-parse FETCH_HEAD)"; echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: tools
        if: steps.current.outputs.go == 'yes'
        run: |
          # an isolated virtualenv: the runner's system pyOpenSSL breaks under a newer cryptography;
          # every package pinned by sha256 (audit Q04): this job can sign attestations
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --only-binary=:all: -r record/requirements-writer.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: the existing chain must be fully attested by this writer before anything is added
        if: steps.current.outputs.go == 'yes'
        run: |
          # exit 2 (an explorer unreachable) still means every entry is covered: coverage comes from Sigstore, checked offline
          rc=0; python3 -I record/record.py check-anchors --ref "refs/heads/$LEDGER_REF" --workflow "$WRITER" || rc=$?
          [ $rc -eq 0 ] || [ $rc -eq 2 ]
      - name: ingest inbox into the chain
        if: steps.current.outputs.go == 'yes'
        id: ingest
        run: |
          read before _ < <(python3 -I record/record.py head)
          # exit 0: all written; 1: something refused, nothing written; 4: some written, some refused. A refused
          # proposal stays in the inbox and fails the run at the end, after the good ones are committed (audit Q13).
          rc=0; python3 -I record/record.py ingest > "$RUNNER_TEMP/written.txt" || rc=$?
          cat "$RUNNER_TEMP/written.txt"
          case $rc in 0) echo "refused=no" >> "$GITHUB_OUTPUT" ;; 1|4) echo "refused=yes" >> "$GITHUB_OUTPUT" ;; *) exit $rc ;; esac
          read seq sha < <(python3 -I record/record.py head)
          echo "from=$((before + 1))" >> "$GITHUB_OUTPUT"; echo "seq=$seq" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "file=ledger/entries/$(printf %06d $seq).json" >> "$GITHUB_OUTPUT"
          echo "n=$(wc -l < "$RUNNER_TEMP/written.txt")" >> "$GITHUB_OUTPUT"
          echo "predicate=$(python3 -I record/record.py range $((before + 1)) $seq 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: stamp the head (OpenTimestamps); refuse to attest if the branch moved
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        run: |
          s=$(printf %06d ${{ steps.ingest.outputs.seq }})
          mkdir -p ledger/anchors
          cp ledger/entries/$s.json "$RUNNER_TEMP/$s.json" && ots stamp "$RUNNER_TEMP/$s.json"
          mv "$RUNNER_TEMP/$s.json.ots" ledger/anchors/$s.ots
          python3 -I record/record.py verify
          git fetch -q origin "$LEDGER_REF"
          [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ] || { echo "the branch moved since checkout; not attesting"; exit 1; }
      - name: attest the range of entries added (Sigstore, public Rekor)
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        id: att
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc  # v2.4.0
        with:
          subject-path: ${{ steps.ingest.outputs.file }}
          predicate-type: https://github.com/5kasgard/exagium/blob/main/record/README.md
          predicate: ${{ steps.ingest.outputs.predicate }}
      - name: check every anchor and commit
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.n != '0'
        id: commit
        run: |
          s=$(printf %06d ${{ steps.ingest.outputs.seq }})
          cp "${{ steps.att.outputs.bundle-path }}" ledger/anchors/$s.sigstore.json
          # exit 2 (an explorer unreachable) mustn't orphan the attestation just made; exit 1 or 3 stops here
          rc=0; python3 -I record/record.py check-anchors --ref "refs/heads/$LEDGER_REF" --workflow "$WRITER" || rc=$?
          [ $rc -eq 0 ] || [ $rc -eq 2 ]
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledger
          git commit -q -m "ledger: entries ${{ steps.ingest.outputs.from }}-${{ steps.ingest.outputs.seq }}, head sha256 ${{ steps.ingest.outputs.sha }} (run ${{ github.run_id }})"
          git push -q origin "HEAD:$LEDGER_REF"
      - name: after a failure past attesting, keep the orphaned attestation's bundle and entries on ci-runs
        # not after a committed attestation: a refused proposal fails the run later, and that is no orphan
        if: (failure() || cancelled()) && steps.att.outcome == 'success' && steps.commit.outcome != 'success'
        run: |
          d="$RUNNER_TEMP/ci"; git init -q "$d"
          cp -r ledger "$RUNNER_TEMP/ledger-orphan"; cp "${{ steps.att.outputs.bundle-path }}" "$RUNNER_TEMP/ledger-orphan/bundle.sigstore.json"
          cd "$d" && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          mkdir -p orphans && cp -r "$RUNNER_TEMP/ledger-orphan" "orphans/${{ github.run_id }}" && git add orphans
          git -c user.name=github-actions -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "orphaned writer attestation, run ${{ github.run_id }}"
          # retry: another run may have pushed to ci-runs meanwhile; each run writes its own folder, so a rebase is clean (audit Q18)
          for i in 1 2 3 4 5; do
            if git push -q origin ci-runs; then echo "pushed on try $i"; break; fi
            [ $i -lt 5 ] || { echo "push to ci-runs failed 5 times"; exit 1; }
            sleep $((i * 7)); git fetch -q origin ci-runs && git -c user.name=github-actions -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' rebase -q FETCH_HEAD
          done
      - name: fail if any proposal was refused (it stays in ledger/inbox/; see this run's ingest log)
        if: steps.current.outputs.go == 'yes' && steps.ingest.outputs.refused == 'yes'
        run: |
          echo "one or more proposals were refused and left in ledger/inbox/; the rest were committed"; exit 1
  gh-verify:
    # Can `gh attestation verify` accept a genuine anchor when pinned to this writer and ref? (review 1, finding 10)
    needs: append
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] this job pushes with the checkout token and uploads no workspace artifact
        with:
          ref: ${{ env.LEDGER_REF }}
      - name: verify the head with gh, pinned and unpinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=5kasgard/exagium; P=https://github.com/5kasgard/exagium/blob/main/record/README.md
          NEW=$(ls ledger/entries/*.json | tail -1)
          t() { f=$1; shift; if out=$(gh attestation verify "$f" -R $R "$@" 2>&1); then r=PASS; else r="FAIL ($(echo "$out" | grep -v '^$' | tail -1 | cut -c1-120))"; fi; echo "$r | $f | $*"; }
          { echo "ref $LEDGER_REF run ${{ github.run_id }}"
            t $NEW --predicate-type $P
            t $NEW --predicate-type $P --signer-workflow $R/$WRITER --source-ref refs/heads/$LEDGER_REF
            t $NEW --predicate-type $P --signer-workflow $R/.github/workflows/record.yml --source-ref refs/heads/main
          } | tee "$RUNNER_TEMP/gh.txt"
          git init -q "$RUNNER_TEMP/ci" && cd "$RUNNER_TEMP/ci"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ci-runs && git checkout -q ci-runs
          mkdir -p e2e && cp "$RUNNER_TEMP/gh.txt" e2e/gh-${{ github.run_id }}.txt && git add e2e
          git -c user.name=github-actions -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "e2e gh verify ${{ github.run_id }}"
          git push -q origin ci-runs
